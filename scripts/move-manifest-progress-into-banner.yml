name: Move Manifest Progress Into Banner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-progress-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gesamtfortschritt in Banner verschieben
        run: node scripts/applyManifestProgressBanner.mjs

      - name: JavaScript-Syntax prüfen
        run: node --check assets/js/views/gameView.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             assets/js/views/gameView.js             assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Move manifest progress into breadcrumb banner"
            git push
          fi
