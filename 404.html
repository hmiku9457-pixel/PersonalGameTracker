<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <meta
            name="robots"
            content="noindex"
        >

        <title>
            Seite nicht gefunden | Personal Game Tracker
        </title>

        <style>
            :root {
                color-scheme: dark;

                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 1.5rem;

                display: grid;
                place-items: center;

                color: #f3f4f6;
                background:
                    radial-gradient(
                        circle at top,
                        #1f2937,
                        #0f172a 58%,
                        #090f1c
                    );
            }

            main {
                width:
                    min(
                        100%,
                        38rem
                    );

                padding:
                    clamp(
                        1.5rem,
                        5vw,
                        2.75rem
                    );

                text-align: center;

                background:
                    rgb(31 41 55 / 88%);

                border:
                    1px
                    solid
                    #374151;

                border-radius: 1rem;

                box-shadow:
                    0 1.25rem 3.5rem
                    rgb(0 0 0 / 35%);
            }

            .error-code {
                margin: 0 0 0.35rem;

                color: #60a5fa;

                font-size:
                    clamp(
                        3rem,
                        12vw,
                        5.5rem
                    );

                font-weight: 800;
                line-height: 1;
            }

            h1 {
                margin:
                    0
                    0
                    0.8rem;

                font-size:
                    clamp(
                        1.45rem,
                        4vw,
                        2rem
                    );
            }

            p {
                margin:
                    0
                    auto
                    1.5rem;

                max-width: 31rem;

                color: #cbd5e1;
                line-height: 1.6;
            }

            a {
                min-height: 2.75rem;
                padding:
                    0.65rem
                    1.1rem;

                display: inline-flex;
                align-items: center;
                justify-content: center;

                color: #ffffff;
                background: #2563eb;

                border:
                    1px
                    solid
                    #60a5fa;

                border-radius: 0.55rem;

                font-weight: 700;
                text-decoration: none;

                transition:
                    background-color 160ms ease,
                    transform 160ms ease;
            }

            a:hover,
            a:focus-visible {
                background: #1d4ed8;

                transform:
                    translateY(
                        -2px
                    );
            }

            a:focus-visible {
                outline:
                    3px
                    solid
                    rgb(147 197 253 / 55%);

                outline-offset: 3px;
            }

            .redirect-note {
                margin:
                    1rem
                    0
                    0;

                color: #94a3b8;

                font-size: 0.85rem;
            }
        </style>
    </head>

    <body>
        <main>
            <p
                class="error-code"
                aria-hidden="true"
            >
                404
            </p>

            <h1>
                Seite nicht gefunden
            </h1>

            <p>
                Die angeforderte Seite existiert nicht oder wurde verschoben.
                Du wirst automatisch zum Personal Game Tracker weitergeleitet.
            </p>

            <a
                id="home-link"
                href="/"
            >
                Zum Personal Game Tracker
            </a>

            <p class="redirect-note">
                Automatische Weiterleitung in wenigen Sekunden …
            </p>
        </main>

        <script>
            (function redirectToTracker() {
                const pathParts =
                    window.location.pathname
                        .split("/")
                        .filter(Boolean);

                const runsOnProjectPages =
                    window.location.hostname
                        .endsWith(
                            ".github.io"
                        ) &&
                    pathParts.length > 0;

                const basePath =
                    runsOnProjectPages
                        ? `/${pathParts[0]}/`
                        : "/";

                const homeUrl =
                    new URL(
                        basePath,
                        window.location.origin
                    );

                const homeLink =
                    document.getElementById(
                        "home-link"
                    );

                if (homeLink) {
                    homeLink.href =
                        homeUrl.href;
                }

                window.setTimeout(
                    () => {
                        window.location.replace(
                            homeUrl.href
                        );
                    },
                    2500
                );
            }());
        </script>
    </body>
</html>
