name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Deployment-Dateien zusammenstellen
        shell: bash
        run: |
          set -euo pipefail

          mkdir _site
          cp index.html 404.html _site/
          cp -R assets data _site/

          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

      - name: Seiten-Dateien hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v5
