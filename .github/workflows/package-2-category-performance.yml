      - name: Patch-Struktur prüfen
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'const categoryElementCache =' \
            assets/js/views/categoryControlsView.js

          grep -q 'const scheduledCategoryUpdateFrames =' \
            assets/js/views/categoryControlsView.js

          grep -q 'sortDirty: true' \
            assets/js/views/categoryControlsView.js

          grep -q '"tracker-item-state-changed"' \
            assets/js/views/categoryControlsView.js

          grep -q '"tracker-item-state-changed"' \
            assets/js/views/categoryView.js

          if grep -q 'new MutationObserver(' \
            assets/js/views/categoryControlsView.js; then
            echo "MutationObserver ist unerwartet noch vorhanden."
            exit 1
          fi

          if grep -q 'getActiveViewScope' \
            assets/js/views/categoryControlsView.js; then
            echo "Veraltete ViewScope-Abhängigkeit ist noch vorhanden."
            exit 1
          fi

      - name: Geänderte JavaScript-Dateien syntaktisch prüfen
        run: |
          node --check assets/js/views/categoryControlsView.js
          node --check assets/js/views/categoryView.js
          node --check tests/e2e/category-controls.spec.mjs

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: Unit-Tests ausführen
        run: npm run test:unit

      - name: Alle Browser-Tests ausführen
        run: npm run test:e2e

      - name: Whitespace prüfen
        run: git diff --check

      - name: Änderungen anzeigen
        run: |
          git diff --stat
          git diff -- \
            assets/js/views/categoryControlsView.js \
            assets/js/views/categoryView.js \
            tests/e2e/category-controls.spec.mjs

      - name: Änderungen gesammelt committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/js/views/categoryControlsView.js \
            assets/js/views/categoryView.js \
            tests/e2e/category-controls.spec.mjs

          if git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "FEHLER: Eine Workflow-Datei wurde versehentlich gestagt."
