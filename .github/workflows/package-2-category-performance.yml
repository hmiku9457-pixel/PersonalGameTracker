          test("Live-Suche filtert ohne erneute DOM-Sortierung", async ({ page }) => {
              await page.goto(
                  `/${MISSIONS_ROUTE}`
              );

              await expect(
                  page.locator(
                      ".tracker-item"
                  )
              ).toHaveCount(
                  515
              );

              const firstItemId =
                  await page
                      .locator(
                          ".tracker-item[data-item-id]"
                      )
                      .first()
                      .getAttribute(
                          "data-item-id"
                      );

              expect(
                  firstItemId
              ).toBeTruthy();

              await page.evaluate(() => {
                  const originalAppend =
                      Element.prototype.append;

                  window.__trackerListAppendCalls =
                      0;

                  Element.prototype.append =
                      function (...nodes) {
                          if (
                              this.classList?.contains(
                                  "tracker-list"
                              )
                          ) {
                              window.__trackerListAppendCalls++;
                          }

                          return originalAppend.apply(
                              this,
                              nodes
                          );
                      };
              });

              await page
                  .locator(
                      ".category-search-input"
                  )
                  .fill(
                      firstItemId
                  );

              await expect.poll(
                  () =>
                      getUnhiddenItemCount(
                          page
                      )
              ).toBeGreaterThan(
                  0
              );

              await expect.poll(
                  () =>
                      getUnhiddenItemCount(
                          page
                      )
              ).toBeLessThan(
                  515
              );

              expect(
                  await page.evaluate(
                      () =>
                          window.__trackerListAppendCalls
                  )
              ).toBe(
                  0
              );

              await page
                  .locator(
                      ".category-search-input"
                  )
                  .press(
                      "Escape"
                  );

              await expect.poll(
                  () =>
                      getUnhiddenItemCount(
                          page
                      )
              ).toBe(
                  515
              );

              expect(
                  await page.evaluate(
                      () =>
                          window.__trackerListAppendCalls
                  )
              ).toBe(
                  0
              );
          });


          test("Sortierwechsel sortiert weiterhin korrekt Z-A", async ({ page }) => {
              await page.goto(
                  `/${MISSIONS_ROUTE}`
              );

              const {
                  names: ascending,
                  language
              } =
                  await getFirstMultiItemListState(
                      page
                  );

              expect(
                  ascending.length
              ).toBeGreaterThan(
                  1
              );

              await page
                  .locator(
                      ".category-sort-select"
                  )
                  .selectOption(
                      "desc"
                  );

              const {
                  names: descending
              } =
                  await getFirstMultiItemListState(
                      page
                  );

              const locale =
                  language === "en"
                      ? "en-US"
                      : "de-DE";

              const collator =
                  new Intl.Collator(
                      locale,
                      {
                          sensitivity:
                              "base",

                          numeric:
                              true
                      }
                  );

              const expectedAscending =
                  [...ascending].sort(
                      (first, second) =>
                          collator.compare(
                              first,
                              second
                          )
                  );

              const expectedDescending =
                  [...ascending].sort(
                      (first, second) =>
                          -collator.compare(
                              first,
                              second
                          )
                  );

              expect(
                  ascending
              ).toEqual(
                  expectedAscending
              );

              expect(
                  descending
              ).toEqual(
                  expectedDescending
              );
          });


          test("Statusfilter reagiert gezielt auf erfolgreich gespeicherten Fortschritt", async ({ page }) => {
              await page.goto(
                  `/${MISSIONS_ROUTE}`
              );

              await page
                  .locator(
                      '[data-status-filter="incomplete"]'
                  )
                  .click();

              const initialIncompleteCount =
                  await getUnhiddenItemCount(
                      page
                  );

              expect(
                  initialIncompleteCount
              ).toBeGreaterThan(
                  0
              );

              const toggle =
                  page.locator(
                      ".tracker-item:not([hidden]) .tracker-toggle:not([disabled])"
                  ).first();

              const itemId =
                  await toggle.getAttribute(
                      "data-item-id"
                  );

              expect(
                  itemId
              ).toBeTruthy();

              await toggle.click();

              await expect.poll(
                  async () =>
                      page.evaluate(
                          id => {
                              const itemElement =
                                  document.querySelector(
                                      `.tracker-item[data-item-id="${CSS.escape(id)}"]`
                                  );

                              return {
                                  completed:
                                      itemElement?.classList.contains(
                                          "is-completed"
                                      ) ?? false,

                                  hidden:
                                      itemElement?.hidden ??
                                      false
                              };
                          },
                          itemId
                      )
              ).toEqual({
                  completed: true,
                  hidden: true
              });

              await expect.poll(
                  () =>
                      getUnhiddenItemCount(
                          page
                      )
              ).toBe(
                  initialIncompleteCount - 1
              );
          });


          async function getUnhiddenItemCount(
              page
          ) {
              return page.evaluate(
                  () =>
                      Array.from(
                          document.querySelectorAll(
                              ".tracker-item"
                          )
                      ).filter(
                          item =>
                              !item.hidden
                      ).length
              );
          }


          async function getFirstMultiItemListState(
              page
          ) {
              return page.evaluate(
                  () => {
                      const list =
                          Array.from(
                              document.querySelectorAll(
                                  ".tracker-list"
                              )
                          ).find(
                              candidate =>
