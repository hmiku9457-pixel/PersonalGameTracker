                          eq() {
                              return query;
                          },

                          order() {
                              return query;
                          },

                          range() {
                              return query;
                          },

                          insert() {
                              return query;
                          },

                          delete() {
                              return query;
                          },

                          maybeSingle() {
                              return Promise.resolve({
                                  data:
                                      data[0] ??
                                      null,

                                  error:
                                      null
                              });
                          },

                          then(resolve) {
                              return Promise.resolve({
                                  data,
                                  error:
                                      null
                              }).then(
                                  resolve
                              );
                          }
                      };

                      return query;
                  }

                  window.supabase = {
                      createClient() {
                          return {
                              auth: {
                                  async getSession() {
                                      return {
                                          data: {
                                              session: {
                                                  user: {
                                                      id:
                                                          "test-user",

                                                      email:
                                                          "test@example.invalid"
                                                  }
                                              }
                                          },

                                          error:
                                              null
                                      };
                                  },

                                  onAuthStateChange() {
                                      return {
                                          data: {
                                              subscription: {
                                                  unsubscribe() {}
                                              }
                                          }
                                      };
                                  },

                                  async signInWithPassword() {
                                      return {
                                          data: {},
                                          error:
                                              null
                                      };
                                  },

                                  async signUp() {
                                      return {
                                          data: {},
                                          error:
                                              null
                                      };
                                  },

                                  async signOut() {
                                      return {
                                          error:
                                              null
                                      };
                                  }
                              },

                              from() {
                                  return result([]);
                              }
                          };
                      }
                  };
              });

              await page.route(
                  "https://cdn.jsdelivr.net/**",
                  route =>
                      route.abort()
              );
          }
          '''

          TEST_FILE.write_text(
