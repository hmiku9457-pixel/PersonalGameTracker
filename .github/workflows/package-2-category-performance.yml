name: Package 2 - Category performance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kategorie-Performance optimieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          CONTROLS_FILE = Path(
              "assets/js/views/categoryControlsView.js"
          )

          CATEGORY_FILE = Path(
              "assets/js/views/categoryView.js"
          )

          TEST_FILE = Path(
              "tests/e2e/category-controls.spec.mjs"
          )

          controls = CONTROLS_FILE.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )

          category = CATEGORY_FILE.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )


          def replace_once(
              source,
              old,
              new,
              label
          ):
              count = source.count(
                  old
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: erwartete genau eine Fundstelle, "
                      f"gefunden: {count}"
                  )

              return source.replace(
                  old,
                  new,
                  1
              )


          # =========================================================
          # categoryControlsView.js
          # =========================================================

          if (
              "const categoryElementCache =" in controls
              and "tracker-item-state-changed" in controls
              and "new MutationObserver(" not in controls
          ):
              print(
                  "[SKIP] categoryControlsView.js ist bereits optimiert."
              )
          else:
              import_block = '''import {
          \tgetActiveViewScope,
          \tregisterViewCleanup
          } from "../services/viewScopeService.js";


          '''

              controls = replace_once(
                  controls,
                  import_block,
                  "",
                  "ViewScope-Import"
              )

              observer_section = (
                  "/* ---------------------------------------------------------\n"
                  "   2. Observer\n"
                  "   --------------------------------------------------------- */"
              )

              controls_section = (
                  "/* ---------------------------------------------------------\n"
                  "   3. Kategorie-Controls\n"
                  "   --------------------------------------------------------- */"
              )

              observer_start = controls.find(
                  observer_section
              )

              controls_start = controls.find(
                  controls_section
              )

              if (
                  observer_start < 0
                  or controls_start < 0
                  or controls_start <= observer_start
              ):
                  raise SystemExit(
                      "Observer-/Controls-Abschnitt konnte nicht "
                      "eindeutig abgegrenzt werden."
                  )

              performance_state = '''/* ---------------------------------------------------------
             2. Performance-Zustand
             --------------------------------------------------------- */

          /*
           * Die Item-Struktur einer gerenderten Kategorie bleibt
           * während ihrer Lebensdauer unverändert. Die dafür
           * benötigten DOM-Referenzen können daher gecacht werden.
           */
          const categoryElementCache =
          \tnew WeakMap();


          /*
           * Schnelle Eingaben in der Volltextsuche werden auf
           * maximal eine Filterberechnung pro Browser-Frame
           * zusammengefasst.
           */
          const scheduledCategoryUpdateFrames =
          \tnew WeakMap();


          /*
           * Wird dieselbe Kategorie-View erneut initialisiert,
           * ersetzen wir den vorherigen Status-Listener sauber.
           */
          const categoryStateChangeHandlers =
          \tnew WeakMap();


          '''

              controls = (
                  controls[:observer_start]
                  + performance_state
                  + controls[controls_start:]
              )

              cleanup_start_marker = '''\t/*
          \t * Eventuell bestehenden Observer einer
          \t * vorherigen Kategorie beenden.
          \t */
          '''

              cleanup_end_marker = '''\t/*
          \t * Doppelte Bedienelemente verhindern.
          \t */
          '''

              cleanup_start = controls.find(
                  cleanup_start_marker
              )

              cleanup_end = controls.find(
                  cleanup_end_marker,
                  cleanup_start + 1
              )

              if (
                  cleanup_start < 0
                  or cleanup_end < 0
              ):
                  raise SystemExit(
                      "Alte Observer-Aufräumlogik konnte nicht "
                      "abgegrenzt werden."
                  )

              new_render_reset = '''\tconst pendingUpdateFrame =
          \t\tscheduledCategoryUpdateFrames.get(
          \t\t\tcontainer
          \t\t);

          \tif (
          \t\tpendingUpdateFrame !==
          \t\tundefined
          \t) {
          \t\tcancelAnimationFrame(
          \t\t\tpendingUpdateFrame
          \t\t);
          \t}

          \tscheduledCategoryUpdateFrames.delete(
          \t\tcontainer
          \t);

          \tcategoryElementCache.delete(
          \t\tcontainer
          \t);


          \tconst previousStateChangeHandler =
          \t\tcategoryStateChangeHandlers.get(
          \t\t\tcontainer
          \t\t);

          \tif (previousStateChangeHandler) {
          \t\tcontainer.removeEventListener(
          \t\t\t"tracker-item-state-changed",
          \t\t\tpreviousStateChangeHandler
          \t\t);

          \t\tcategoryStateChangeHandlers.delete(
          \t\t\tcontainer
          \t\t);
          \t}


          '''

              controls = (
                  controls[:cleanup_start]
                  + new_render_reset
                  + controls[cleanup_end:]
              )

              controls = replace_once(
                  controls,
                  '''\t\tsort: "asc",

          \t\tsearchActive: false,
          ''',
                  '''\t\tsort: "asc",
          \t\tsortDirty: true,

          \t\tsearchActive: false,
          ''',
                  "controlState.sortDirty"
              )

              # Live-Suche bündeln.
              live_start = controls.find(
                  "\t * Live-Suche\n"
              )

              escape_start = controls.find(
                  "\t * ESC leert ausschließlich die Suche.\n",
                  live_start + 1
              )

              if (
                  live_start < 0
                  or escape_start < 0
              ):
                  raise SystemExit(
                      "Live-Suchabschnitt konnte nicht abgegrenzt werden."
                  )

              live_block = controls[
                  live_start:
                  escape_start
              ]

              if live_block.count(
                  "applyCategoryControls("
              ) != 1:
                  raise SystemExit(
                      "Live-Suchaufruf ist nicht eindeutig."
                  )

              live_block = live_block.replace(
                  "applyCategoryControls(",
                  "scheduleCategoryControlsUpdate(",
                  1
              )

              controls = (
                  controls[:live_start]
                  + live_block
                  + controls[escape_start:]
              )

              # Escape-Suche ebenfalls bündeln.
              escape_start = controls.find(
                  "\t * ESC leert ausschließlich die Suche.\n"
              )

              sort_event_start = controls.find(
                  "\t * Sortierung\n",
                  escape_start + 1
              )

              if (
                  escape_start < 0
                  or sort_event_start < 0
              ):
                  raise SystemExit(
                      "Escape-/Sortierabschnitt konnte nicht abgegrenzt werden."
                  )

              escape_block = controls[
                  escape_start:
                  sort_event_start
              ]

              if escape_block.count(
                  "applyCategoryControls("
              ) != 1:
                  raise SystemExit(
                      "Escape-Suchaufruf ist nicht eindeutig."
                  )

              escape_block = escape_block.replace(
                  "applyCategoryControls(",
                  "scheduleCategoryControlsUpdate(",
                  1
              )

              controls = (
                  controls[:escape_start]
                  + escape_block
                  + controls[sort_event_start:]
              )

              # Sortierung als dirty markieren.
              controls = replace_once(
                  controls,
                  '''\t\t\tcontrolState.sort =
          \t\t\t\tsortSelect.value;


          \t\t\tapplyCategoryControls(
          ''',
                  '''\t\t\tcontrolState.sort =
          \t\t\t\tsortSelect.value;

          \t\t\tcontrolState.sortDirty =
          \t\t\t\ttrue;


          \t\t\tapplyCategoryControls(
          ''',
                  "Sortier-Event"
              )

              # MutationObserver durch gezieltes Event ersetzen.
              observer_event_marker = '''\t/*
          \t * =====================================================
          \t * Änderung eines Tracker-Status beobachten
          \t * =====================================================
          \t */
          '''

              initial_marker = '''\t/*
          \t * Initial anwenden.
          '''

              event_start = controls.find(
                  observer_event_marker
              )

              initial_start = controls.find(
                  initial_marker,
                  event_start + 1
              )

              if (
                  event_start < 0
                  or initial_start < 0
              ):
                  raise SystemExit(
                      "MutationObserver-Block konnte nicht abgegrenzt werden."
                  )

              targeted_event = '''\t/*
          \t * =====================================================
          \t * Gezielt auf geänderten Tracker-Status reagieren
          \t * =====================================================
          \t */
          \tconst stateChangeHandler =
          \t\t() => {
          \t\t\t/*
          \t\t\t * Ohne aktiven Statusfilter ändert ein
          \t\t\t * Fortschrittswechsel die sichtbare Menge nicht.
          \t\t\t */
          \t\t\tif (
          \t\t\t\tcontrolState.status ===
          \t\t\t\t"all"
          \t\t\t) {
          \t\t\t\treturn;
          \t\t\t}

          \t\t\tapplyCategoryControls(
          \t\t\t\tcontainer,
          \t\t\t\tcontrolState,
          \t\t\t\tresultCount,
          \t\t\t\temptyMessage
          \t\t\t);
          \t\t};

          \tcontainer.addEventListener(
          \t\t"tracker-item-state-changed",
          \t\tstateChangeHandler
          \t);

          \tcategoryStateChangeHandlers.set(
          \t\tcontainer,
          \t\tstateChangeHandler
          \t);


          '''

              controls = (
                  controls[:event_start]
                  + targeted_event
                  + controls[initial_start:]
              )

              # Sortier-/Filterkern vollständig über klar definierte
              # Abschnittsgrenzen ersetzen.
              sort_section_marker = (
                  "/* ---------------------------------------------------------\n"
                  "   9. Sortierung\n"
                  "   --------------------------------------------------------- */"
              )

              result_section_marker = (
                  "/* ---------------------------------------------------------\n"
                  "   11. Treffertext\n"
                  "   --------------------------------------------------------- */"
              )

              sort_section_start = controls.find(
                  sort_section_marker
              )

              result_section_start = controls.find(
                  result_section_marker,
                  sort_section_start + 1
              )

              if (
                  sort_section_start < 0
                  or result_section_start < 0
              ):
                  raise SystemExit(
                      "Sortier-/Controls-Kern konnte nicht abgegrenzt werden."
                  )

              optimized_core = '''/* ---------------------------------------------------------
             9. DOM-Cache
             --------------------------------------------------------- */

          /**
           * Erfasst die für Suche, Filterung und Sortierung
           * benötigten DOM-Elemente einmal pro Kategorie.
           *
           * @param {HTMLElement} container
           * @returns {object}
           */
          function getCategoryElements(
          \tcontainer
          ) {
          \tconst cached =
          \t\tcategoryElementCache.get(
          \t\t\tcontainer
          \t\t);

          \tif (cached) {
          \t\treturn cached;
          \t}


          \tconst items =
          \t\tArray.from(
          \t\t\tcontainer.querySelectorAll(
          \t\t\t\t".tracker-item"
          \t\t\t)
          \t\t);

          \tconst lists =
          \t\tArray.from(
          \t\t\tcontainer.querySelectorAll(
          \t\t\t\t".tracker-list"
          \t\t\t)
          \t\t);

          \tconst groups =
          \t\tArray.from(
          \t\t\tcontainer.querySelectorAll(
          \t\t\t\t".category-group"
          \t\t\t)
          \t\t);


          \tconst listItems =
          \t\tnew Map();

          \tfor (
          \t\tconst list
          \t\tof lists
          \t) {
          \t\tlistItems.set(
          \t\t\tlist,
          \t\t\tArray.from(
          \t\t\t\tlist.querySelectorAll(
          \t\t\t\t\t":scope > .tracker-item"
          \t\t\t\t)
          \t\t\t)
          \t\t);
          \t}


          \tconst groupItems =
          \t\tnew Map();

          \tfor (
          \t\tconst group
          \t\tof groups
          \t) {
          \t\tgroupItems.set(
          \t\t\tgroup,
          \t\t\tArray.from(
          \t\t\t\tgroup.querySelectorAll(
          \t\t\t\t\t".tracker-item"
          \t\t\t\t)
          \t\t\t)
          \t\t);
          \t}


          \tconst result = {
          \t\titems,
          \t\tlists,
          \t\tgroups,
          \t\tlistItems,
          \t\tgroupItems
          \t};

          \tcategoryElementCache.set(
          \t\tcontainer,
          \t\tresult
          \t);

          \treturn result;
          }


          /**
           * Bündelt schnelle Suchänderungen auf maximal
           * eine Filterberechnung pro Browser-Frame.
           *
           * @param {HTMLElement} container
           * @param {Object} state
           * @param {HTMLElement} resultCount
           * @param {HTMLElement} emptyMessage
           */
          function scheduleCategoryControlsUpdate(
          \tcontainer,
          \tstate,
          \tresultCount,
          \temptyMessage
          ) {
          \tconst previousFrame =
          \t\tscheduledCategoryUpdateFrames.get(
          \t\t\tcontainer
          \t\t);

          \tif (
          \t\tpreviousFrame !==
          \t\tundefined
          \t) {
          \t\tcancelAnimationFrame(
          \t\t\tpreviousFrame
          \t\t);
          \t}


          \tconst frame =
          \t\trequestAnimationFrame(
          \t\t\t() => {
          \t\t\t\tscheduledCategoryUpdateFrames.delete(
          \t\t\t\t\tcontainer
          \t\t\t\t);

          \t\t\t\tif (
          \t\t\t\t\t!container.isConnected
          \t\t\t\t) {
          \t\t\t\t\treturn;
          \t\t\t\t}

          \t\t\t\tapplyCategoryControls(
          \t\t\t\t\tcontainer,
          \t\t\t\t\tstate,
          \t\t\t\t\tresultCount,
          \t\t\t\t\temptyMessage
          \t\t\t\t);
          \t\t\t}
          \t\t);

          \tscheduledCategoryUpdateFrames.set(
          \t\tcontainer,
          \t\tframe
          \t);
          }


          /* ---------------------------------------------------------
             10. Sortierung
             --------------------------------------------------------- */

          /**
           * Sortiert die gecachten Items innerhalb aller
           * Tracker-Listen.
           *
           * @param {object} categoryElements
           * @param {string} direction
           */
          function sortCategoryItems(
          \tcategoryElements,
          \tdirection
          ) {
          \tconst locale =
          \t\tgetCurrentLocale();

          \tfor (
          \t\tconst list
          \t\tof categoryElements.lists
          \t) {
          \t\tconst items =
          \t\t\tcategoryElements.listItems.get(
          \t\t\t\tlist
          \t\t\t) ?? [];

          \t\titems.sort(
          \t\t\t(first, second) => {
          \t\t\t\tconst firstName =
          \t\t\t\t\tgetItemSortName(
          \t\t\t\t\t\tfirst
          \t\t\t\t\t);

          \t\t\t\tconst secondName =
          \t\t\t\t\tgetItemSortName(
          \t\t\t\t\t\tsecond
          \t\t\t\t\t);

          \t\t\t\tconst comparison =
          \t\t\t\t\tfirstName.localeCompare(
          \t\t\t\t\t\tsecondName,
          \t\t\t\t\t\tlocale,
          \t\t\t\t\t\t{
          \t\t\t\t\t\t\tsensitivity:
          \t\t\t\t\t\t\t\t"base",

          \t\t\t\t\t\t\tnumeric:
          \t\t\t\t\t\t\t\ttrue
          \t\t\t\t\t\t}
          \t\t\t\t\t);

          \t\t\t\treturn direction ===
          \t\t\t\t\t"desc"
          \t\t\t\t\t? -comparison
          \t\t\t\t\t: comparison;
          \t\t\t}
          \t\t);

          \t\t/*
          \t\t * Ein DOM-Append pro Liste statt eines
          \t\t * einzelnen Appends pro Item.
          \t\t */
          \t\tlist.append(
          \t\t\t...items
          \t\t);
          \t}
          }


          /* ---------------------------------------------------------
             11. Controls anwenden
             --------------------------------------------------------- */

          /**
           * Wendet Suche und Statusfilter auf die gecachten
           * Kategorieelemente an.
           *
           * Sortiert wird ausschließlich beim initialen Rendern
           * oder nach einer Änderung der Sortierauswahl.
           *
           * @param {HTMLElement} container
           * @param {Object} state
           * @param {HTMLElement} resultCount
           * @param {HTMLElement} emptyMessage
           */
          function applyCategoryControls(
          \tcontainer,
          \tstate,
          \tresultCount,
          \temptyMessage
          ) {
          \t/*
          \t * Ein direkt ausgelöstes Update ersetzt eine
          \t * eventuell noch ausstehende Suchberechnung.
          \t */
          \tconst pendingFrame =
          \t\tscheduledCategoryUpdateFrames.get(
          \t\t\tcontainer
          \t\t);

          \tif (
          \t\tpendingFrame !==
          \t\tundefined
          \t) {
          \t\tcancelAnimationFrame(
          \t\t\tpendingFrame
          \t\t);

          \t\tscheduledCategoryUpdateFrames.delete(
          \t\t\tcontainer
          \t\t);
          \t}


          \tconst categoryElements =
          \t\tgetCategoryElements(
          \t\t\tcontainer
          \t\t);

          \tconst query =
          \t\tnormalizeSearchText(
          \t\t\tstate.query
          \t\t);

          \tconst searchTerms =
          \t\tquery
          \t\t\t.split(/\\s+/)
          \t\t\t.filter(Boolean);

          \tconst searchIsActive =
          \t\tsearchTerms.length > 0;

          \tconst statusIsActive =
          \t\tstate.status !==
          \t\t\t"all";

          \tconst groups =
          \t\tcategoryElements.groups;


          \t/*
          \t * Suche beginnt:
          \t * Accordion-Zustand sichern.
          \t */
          \tif (
          \t\tsearchIsActive &&
          \t\t!state.searchActive
          \t) {
          \t\tstate.searchActive =
          \t\t\ttrue;

          \t\tstate.groupOpenState.clear();

          \t\tfor (
          \t\t\tconst group
          \t\t\tof groups
          \t\t) {
          \t\t\tstate.groupOpenState.set(
          \t\t\t\tgroup,
          \t\t\t\tgroup.open
          \t\t\t);
          \t\t}
          \t}


          \t/*
          \t * Suche endet:
          \t * ursprünglichen Accordion-Zustand herstellen.
          \t */
          \tif (
          \t\t!searchIsActive &&
          \t\tstate.searchActive
          \t) {
          \t\tfor (
          \t\t\tconst group
          \t\t\tof groups
          \t\t) {
          \t\t\tif (
          \t\t\t\tstate.groupOpenState.has(
          \t\t\t\t\tgroup
          \t\t\t\t)
          \t\t\t) {
          \t\t\t\tgroup.open =
          \t\t\t\t\tstate.groupOpenState.get(
          \t\t\t\t\t\tgroup
          \t\t\t\t\t);
          \t\t\t}
          \t\t}

          \t\tstate.groupOpenState.clear();

          \t\tstate.searchActive =
          \t\t\tfalse;
          \t}


          \tif (state.sortDirty) {
          \t\tsortCategoryItems(
          \t\t\tcategoryElements,
          \t\t\tstate.sort
          \t\t);

          \t\tstate.sortDirty =
          \t\t\tfalse;
          \t}


          \tlet visibleItemCount =
          \t\t0;

          \tfor (
          \t\tconst item
          \t\tof categoryElements.items
          \t) {
          \t\tconst searchText =
          \t\t\tgetItemSearchText(
          \t\t\t\titem
          \t\t\t);

          \t\tconst matchesSearch =
          \t\t\tsearchTerms.every(
          \t\t\t\tterm =>
          \t\t\t\t\tsearchText.includes(
          \t\t\t\t\t\tterm
          \t\t\t\t\t)
          \t\t\t);

          \t\tconst matchesStatus =
          \t\t\tmatchesStatusFilter(
          \t\t\t\titem,
          \t\t\t\tstate.status
          \t\t\t);

          \t\tconst visible =
          \t\t\tmatchesSearch &&
          \t\t\tmatchesStatus;

          \t\titem.hidden =
          \t\t\t!visible;

          \t\tif (visible) {
          \t\t\tvisibleItemCount++;
          \t\t}
          \t}


          \tfor (
          \t\tconst list
          \t\tof categoryElements.lists
          \t) {
          \t\tconst listEntries =
          \t\t\tcategoryElements.listItems.get(
          \t\t\t\tlist
          \t\t\t) ?? [];

          \t\tlist.hidden =
          \t\t\t!listEntries.some(
          \t\t\t\titem =>
          \t\t\t\t\t!item.hidden
          \t\t\t);
          \t}


          \tfor (
          \t\tconst group
          \t\tof groups
          \t) {
          \t\tconst groupEntries =
          \t\t\tcategoryElements.groupItems.get(
          \t\t\t\tgroup
          \t\t\t) ?? [];

          \t\tconst hasVisibleItem =
          \t\t\tgroupEntries.some(
          \t\t\t\titem =>
          \t\t\t\t\t!item.hidden
          \t\t\t);

          \t\tgroup.hidden =
          \t\t\t!hasVisibleItem;

          \t\tif (
          \t\t\tsearchIsActive &&
          \t\t\thasVisibleItem
          \t\t) {
          \t\t\tgroup.open =
          \t\t\t\ttrue;
          \t\t}
          \t}


          \tif (searchIsActive) {
          \t\tresultCount.textContent =
          \t\t\tgetResultCountText(
          \t\t\t\tvisibleItemCount,
          \t\t\t\ttrue
          \t\t\t);

          \t\tresultCount.hidden =
          \t\t\tfalse;
          \t}
          \telse if (statusIsActive) {
          \t\tresultCount.textContent =
          \t\t\tgetResultCountText(
          \t\t\t\tvisibleItemCount,
          \t\t\t\tfalse
          \t\t\t);

          \t\tresultCount.hidden =
          \t\t\tfalse;
          \t}
          \telse {
          \t\tresultCount.textContent =
          \t\t\t"";

          \t\tresultCount.hidden =
          \t\t\ttrue;
          \t}


          \tconst filteringIsActive =
          \t\tsearchIsActive ||
          \t\tstatusIsActive;

          \temptyMessage.hidden =
          \t\t!(
          \t\t\tfilteringIsActive &&
          \t\t\tvisibleItemCount === 0
          \t\t);
          }


          '''

              controls = (
                  controls[:sort_section_start]
                  + optimized_core
                  + controls[result_section_start:]
              )

              controls = replace_once(
                  controls,
                  '''/* ---------------------------------------------------------
             11. Treffertext
             --------------------------------------------------------- */''',
                  '''/* ---------------------------------------------------------
             12. Treffertext
             --------------------------------------------------------- */''',
                  "Treffertext-Nummerierung"
              )

              if "new MutationObserver(" in controls:
                  raise SystemExit(
                      "MutationObserver ist nach dem Patch "
                      "weiterhin vorhanden."
                  )

              if (
                  "getActiveViewScope" in controls
                  or "registerViewCleanup" in controls
                  or "activeItemStateObserver" in controls
              ):
                  raise SystemExit(
                      "Alte Observer-/ViewScope-Abhängigkeit ist "
                      "nach dem Patch weiterhin vorhanden."
                  )

              required_tokens = [
                  "const categoryElementCache =",
                  "const scheduledCategoryUpdateFrames =",
                  "const categoryStateChangeHandlers =",
                  "sortDirty: true",
                  "scheduleCategoryControlsUpdate(",
                  '"tracker-item-state-changed"',
                  "categoryElements.listItems.get(",
                  "categoryElements.groupItems.get("
              ]

              missing = [
                  token
                  for token in required_tokens
                  if token not in controls
              ]

              if missing:
                  raise SystemExit(
                      "Optimierter Controls-Code ist unvollständig: "
                      + ", ".join(missing)
                  )

              CONTROLS_FILE.write_text(
                  controls,
                  encoding="utf-8"
              )

              print(
                  "[OK] categoryControlsView.js optimiert."
              )


          # =========================================================
          # categoryView.js
          # =========================================================

          if (
              '"tracker-item-state-changed"' in category
          ):
              print(
                  "[SKIP] categoryView.js sendet das Status-Event bereits."
              )
          else:
              handler_start = category.find(
                  "export function registerProgressToggleHandler("
              )

              if handler_start < 0:
                  raise SystemExit(
                      "registerProgressToggleHandler() wurde nicht gefunden."
                  )

              progress_anchor = '''\t\t\t\tupdateCurrentCategoryProgress(
          \t\t\t\t\tdata,
          \t\t\t\t\tprogressData
          \t\t\t\t);
          '''

              progress_pos = category.find(
                  progress_anchor,
                  handler_start
              )

              if progress_pos < 0:
                  raise SystemExit(
                      "Erfolgreicher Kategorie-Fortschrittsblock "
                      "wurde nicht gefunden."
                  )

              insertion_pos = (
                  progress_pos
                  + len(
                      progress_anchor
                  )
              )

              event_block = '''

          \t\t\t\t/*
          \t\t\t\t * Kategorie-Controls gezielt über den
          \t\t\t\t * erfolgreich gespeicherten Statuswechsel
          \t\t\t\t * informieren.
          \t\t\t\t */
          \t\t\t\tif (listItem) {
          \t\t\t\t\tcontainer.dispatchEvent(
          \t\t\t\t\t\tnew CustomEvent(
          \t\t\t\t\t\t\t"tracker-item-state-changed",
          \t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\tdetail: {
          \t\t\t\t\t\t\t\t\titemId:
          \t\t\t\t\t\t\t\t\t\titem.id,

          \t\t\t\t\t\t\t\t\tcompleted:
          \t\t\t\t\t\t\t\t\t\tnewState
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t)
          \t\t\t\t\t);
          \t\t\t\t}
          '''

              category = (
                  category[:insertion_pos]
                  + event_block
                  + category[insertion_pos:]
              )

              CATEGORY_FILE.write_text(
                  category,
                  encoding="utf-8"
              )

              print(
                  "[OK] categoryView.js sendet gezieltes Status-Event."
              )


          # =========================================================
          # E2E-Regressionstests
          # =========================================================

          TEST_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          TEST_FILE_CONTENT = r'''import {
