                                  ? Array.from(
                                      list.querySelectorAll(
                                          ":scope > .tracker-item .tracker-item-name"
                                      )
                                  ).map(
                                      element =>
                                          element.textContent?.trim() ??
                                          ""
                                  )
                                  : []
                      };
                  }
              );
          }


          async function installAuthenticatedSupabaseMock(
              page
          ) {
              await page.addInitScript(() => {
                  function result(
                      data = []
                  ) {
                      const query = {
