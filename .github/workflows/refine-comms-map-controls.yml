name: Refine Comms Map Controls

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Karten-Bedienbereich verfeinern
        run: node scripts/refineCommsMapControls.mjs

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Refine Comms map control layout"
            git push
          fi
