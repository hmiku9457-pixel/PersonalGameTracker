name: Hotfix - Division 2 lists v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Division-2-Listen reparieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          CATEGORY_VIEW = Path(
              "assets/js/views/categoryView.js"
          )

          CONTROLS_VIEW = Path(
              "assets/js/views/categoryControlsView.js"
          )

          COMMS_VIEW = Path(
              "assets/js/views/commsOverviewView.js"
          )

          MISSIONS_MANIFEST = Path(
              "data/theDivision2/collectibles/comms/missions/manifest.json"
          )


          def read(path):
              return path.read_text(
                  encoding="utf-8"
              ).replace(
                  "\r\n",
                  "\n"
              )


          def write(path, content):
              path.write_text(
                  content.rstrip() + "\n",
                  encoding="utf-8"
              )
              print(
                  f"[WRITE] {path}"
              )


          def replace_once(
              source,
              old,
              new,
              label
          ):
              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{label}: erwartete genau eine Fundstelle, "
                      f"gefunden: {count}"
                  )

              return source.replace(
                  old,
                  new,
                  1
              )


          # =========================================================
          # 1. Kategorie-Daten nicht mehr auf Supabase warten lassen
          # =========================================================

          category_view = read(
              CATEGORY_VIEW
          )

          old_load_block = '''\t\tconst [
          \t\t\tdata,
          \t\t\tprogressData
          \t\t] = await Promise.all([
          \t\t\tloadCategoryData(
          \t\t\t\tgame.id,
          \t\t\t\tcategory
          \t\t\t),

          \t\t\tloadGameProgressData(
          \t\t\t\tgame.id
          \t\t\t)
          \t\t]);
          '''

          new_load_block = '''\t\t/*
          \t\t * Die lokale Kategoriedatei ist die Voraussetzung
          \t\t * für die Ansicht. Persönlicher Fortschritt darf
          \t\t * das initiale Rendering dagegen nicht blockieren.
          \t\t */
          \t\tconst progressData = {
          \t\t\tsource: "pending",
          \t\t\tgameId:
          \t\t\t\tgame.id,
          \t\t\tauthenticated: false,
          \t\t\tavailable: false,
          \t\t\tprogress: {},
          \t\t\tcompletedByCategory: {}
          \t\t};

          \t\tconst progressPromise =
          \t\t\tloadGameProgressData(
          \t\t\t\tgame.id
          \t\t\t);

          \t\tconst data =
          \t\t\tawait loadCategoryData(
          \t\t\t\tgame.id,
          \t\t\t\tcategory
          \t\t\t);
          '''

          if old_load_block in category_view:
              category_view = replace_once(
                  category_view,
                  old_load_block,
                  new_load_block,
                  "Category View: nicht-blockierendes Laden"
              )
          elif (
              'source: "pending"' in category_view
              and "const progressPromise =" in category_view
          ):
              print(
                  "[SKIP] Category View lädt Fortschritt bereits nicht-blockierend."
              )
          else:
              raise SystemExit(
                  "Category View: erwarteter Ladeblock wurde nicht gefunden."
              )


          # =========================================================
          # 2. Nach Rendern echten Fortschritt einspielen
          # =========================================================

          old_render_end = '''\t\tupdateActiveGameNavigation(
          \t\t\tgame.id
          \t\t);
          \t}
          \tcatch (error) {
          '''

          new_render_end = '''\t\tupdateActiveGameNavigation(
          \t\t\tgame.id
          \t\t);


          \t\t/*
          \t\t * Fortschritt nachträglich in die bereits sichtbare
          \t\t * Liste einspielen. Die Seite bleibt dadurch auch
          \t\t * bei langsamer Supabase-Verbindung bedienbar.
          \t\t */
          \t\tvoid progressPromise.then(
          \t\t\tloadedProgressData => {
          \t\t\t\tif (
          \t\t\t\t\tviewScope &&
          \t\t\t\t\t!isViewScopeCurrent(
          \t\t\t\t\t\tviewScope
          \t\t\t\t\t)
          \t\t\t\t) {
          \t\t\t\t\treturn;
          \t\t\t\t}

          \t\t\t\tObject.assign(
          \t\t\t\t\tprogressData,
          \t\t\t\t\tloadedProgressData
          \t\t\t\t);

          \t\t\t\tprogressData.progress =
          \t\t\t\t\tloadedProgressData?.progress ??
          \t\t\t\t\t{};

          \t\t\t\tprogressData.completedByCategory =
          \t\t\t\t\tloadedProgressData?.completedByCategory ??
          \t\t\t\t\t{};

          \t\t\t\thydrateCategoryProgress(
          \t\t\t\t\tcategoryContent,
          \t\t\t\t\tdata,
          \t\t\t\t\tprogressData
          \t\t\t\t);
          \t\t\t}
          \t\t);
          \t}
          \tcatch (error) {
          '''

          if old_render_end in category_view:
              category_view = replace_once(
                  category_view,
                  old_render_end,
                  new_render_end,
                  "Category View: Progress-Hydration starten"
              )
          elif "hydrateCategoryProgress(" in category_view:
              print(
                  "[SKIP] Category View startet Progress-Hydration bereits."
              )
          else:
              raise SystemExit(
                  "Category View: Render-Ende wurde nicht gefunden."
              )


          # =========================================================
          # 3. Fortschritts-Hydration ergänzen
          # =========================================================

          helper_marker = '''/* ---------------------------------------------------------
             12. Fortschrittsbuttons
             --------------------------------------------------------- */
          '''

          helper_code = '''/**
           * Spielt nachträglich geladene Fortschrittsdaten
           * in eine bereits gerenderte Kategorie ein.
           *
           * @param {HTMLElement} container
           * @param {Object|Array} data
           * @param {Object} progressData
           */
          function hydrateCategoryProgress(
          \tcontainer,
          \tdata,
          \tprogressData
          ) {
          \tconst renderedItems =
          \t\tcontainer.querySelectorAll(
          \t\t\t".tracker-item[data-item-id]"
          \t\t);

          \tfor (
          \t\tconst listItem
          \t\tof renderedItems
          \t) {
          \t\tconst itemId =
          \t\t\tlistItem.dataset.itemId;

          \t\tconst item =
          \t\t\tfindItemById(
          \t\t\t\tdata,
          \t\t\t\titemId
          \t\t\t);

          \t\tif (!item) {
          \t\t\tcontinue;
          \t\t}

          \t\tconst statusIndicator =
          \t\t\tlistItem.querySelector(
          \t\t\t\t".tracker-item-status"
          \t\t\t);

          \t\tconst toggleButton =
          \t\t\tlistItem.querySelector(
          \t\t\t\t".tracker-toggle"
          \t\t\t);

          \t\tif (
          \t\t\t!statusIndicator ||
          \t\t\t!toggleButton
          \t\t) {
          \t\t\tcontinue;
          \t\t}

          \t\tupdateTrackerItemState(
          \t\t\tlistItem,
          \t\t\tstatusIndicator,
          \t\t\ttoggleButton,
          \t\t\tisItemCompleted(
          \t\t\t\titem,
          \t\t\t\tprogressData
          \t\t\t),
          \t\t\tprogressData?.authenticated ===
          \t\t\t\ttrue
          \t\t);
          \t}

          \tupdateAllCategoryGroupProgress(
          \t\tcontainer
          \t);

          \tupdateCurrentCategoryProgress(
          \t\tdata,
          \t\tprogressData
          \t);

          \t/*
          \t * Falls bereits ein Statusfilter aktiv ist,
          \t * genügt ein gezieltes Controls-Update.
          \t */
          \tcontainer.dispatchEvent(
          \t\tnew CustomEvent(
          \t\t\t"tracker-item-state-changed"
          \t\t)
          \t);
          }


          '''

          if (
              "function hydrateCategoryProgress("
              not in category_view
          ):
              if helper_marker not in category_view:
                  raise SystemExit(
                      "Category View: Fortschrittsbutton-Marker fehlt."
                  )

              category_view = category_view.replace(
                  helper_marker,
                  helper_code
                  + helper_marker,
                  1
              )

          write(
              CATEGORY_VIEW,
              category_view
          )


          # =========================================================
          # 4. Fehlenden Formatter im Statusfilter korrigieren
          # =========================================================

          controls_view = read(
              CONTROLS_VIEW
          )

          old_status_call = '''\t\t\t\tapplyCategoryControls(
          \t\t\t\t\tcontainer,
          \t\t\t\t\tcontrolState,
          \t\t\t\t\tresultCount,
          \t\t\t\t\temptyMessage
          \t\t\t\t);
          '''

          new_status_call = '''\t\t\t\tapplyCategoryControls(
          \t\t\t\t\tcontainer,
          \t\t\t\t\tcontrolState,
          \t\t\t\t\tresultCount,
          \t\t\t\t\temptyMessage,
          \t\t\t\t\tgetResultCountText
          \t\t\t\t);
          '''

          if old_status_call in controls_view:
              controls_view = replace_once(
                  controls_view,
                  old_status_call,
                  new_status_call,
                  "Category Controls: Statusfilter-Formatter"
              )
          elif (
              new_status_call
              in controls_view
          ):
              print(
                  "[SKIP] Statusfilter besitzt den Formatter bereits."
              )
          else:
              raise SystemExit(
                  "Category Controls: Statusfilter-Aufruf nicht gefunden."
              )

          write(
              CONTROLS_VIEW,
              controls_view
          )


          # =========================================================
          # 5. Comms-Präsentationsmetadaten sicher weiterreichen
          # =========================================================

          comms_view = read(
              COMMS_VIEW
          )

          list_start = comms_view.find(
              'if (view === "list")'
          )

          map_start = comms_view.find(
              'if (view === "map")',
              list_start + 1
          )

          if (
              list_start < 0 or
              map_start < 0
          ):
              raise SystemExit(
                  "Comms View: Listenabschnitt konnte nicht erkannt werden."
              )

          list_block = comms_view[
              list_start:
              map_start
          ]

          if "pageClass:" not in list_block:
              old_description = '''                description:
                              sectionManifest.description ??
                              section.description,
                          file: resolveRelativeFile(
          '''

              new_description = '''                description:
                              sectionManifest.description ??
                              section.description,
                          pageClass:
                              sectionManifest.pageClass ??
                              section.pageClass,
                          file: resolveRelativeFile(
          '''

              comms_view = replace_once(
                  comms_view,
                  old_description,
                  new_description,
                  "Comms View: pageClass"
              )

          write(
              COMMS_VIEW,
              comms_view
          )


          # =========================================================
          # 6. Missions-Manifest mit pageClass absichern
          # =========================================================

          manifest = read(
              MISSIONS_MANIFEST
          )

          if (
              '"pageClass": "comms-list-page"'
              not in manifest
          ):
              manifest = replace_once(
                  manifest,
                  '''  "view": "list",
            "map": null,''',
                  '''  "view": "list",
            "pageClass": "comms-list-page",
            "map": null,''',
                  "Missions-Manifest: pageClass"
              )

          write(
              MISSIONS_MANIFEST,
              manifest
          )


          print(
              "Division-2-Listen-Hotfix v2 angewendet."
          )
          PY

      - name: Aenderungen committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/js/views/categoryView.js \
            assets/js/views/categoryControlsView.js \
            assets/js/views/commsOverviewView.js \
            data/theDivision2/collectibles/comms/missions/manifest.json

          if git diff --cached --quiet; then
            echo "Keine Aenderungen erforderlich."
            exit 0
          fi

          git commit -m "Unblock Division 2 category lists [skip ci]"
          git push
