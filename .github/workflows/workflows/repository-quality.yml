name: Repository quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find assets scripts tests \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -print0
          )

      - name: Browser-Smoke-Tests ausführen
        run: npm run test:e2e

      - name: Whitespace prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git show --check --oneline --no-renames HEAD
          fi

      - name: Playwright-Artefakte bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
