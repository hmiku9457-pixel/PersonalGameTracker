name: Final repository cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cleanup-Skript prüfen
        run: node --check scripts/applyFinalRepositoryCleanup.mjs

      - name: Cleanup anwenden
        run: node scripts/applyFinalRepositoryCleanup.mjs

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find assets scripts tests \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -print0
          )

      - name: Browser-Smoke-Tests ausführen
        run: npm run test:e2e

      - name: Workflow-Änderungen ausschließen
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/workflows; then
            echo "Das Cleanup darf im Workflow-Lauf keine Workflow-Dateien verändern."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Temporäres Cleanup-Skript entfernen
        run: rm -f scripts/applyFinalRepositoryCleanup.mjs

      - name: Diff prüfen
        run: git diff --check

      - name: Änderungen committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine Cleanup-Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize repository cleanup"
          git push
