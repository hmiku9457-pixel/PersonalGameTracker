name: Repository quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prüfen, ob ein Update noch aussteht
        id: update_state
        shell: bash
        run: |
          if [[ -f scripts/applySystemOptimizationPackage.mjs || \
                -f scripts/applyProgressSummaryFix.mjs ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Ein Update-Paket wurde noch nicht angewendet. Die Qualitätsprüfung wird bis dahin übersprungen."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Node.js einrichten
        if: steps.update_state.outputs.pending == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.update_state.outputs.pending == 'false'
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        if: steps.update_state.outputs.pending == 'false'
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        if: steps.update_state.outputs.pending == 'false'
        run: npm run check:progress-index

      - name: Repository validieren
        if: steps.update_state.outputs.pending == 'false'
        run: npm run validate:data

      - name: JavaScript-Syntax prüfen
        if: steps.update_state.outputs.pending == 'false'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Browser-Smoke-Tests ausführen
        if: steps.update_state.outputs.pending == 'false'
        run: npm run test:e2e

      - name: Whitespace des Pushes prüfen
        if: >-
          steps.update_state.outputs.pending == 'false' &&
          github.event_name == 'push'
        shell: bash
        run: git show --check --oneline --no-renames HEAD

      - name: Whitespace des Pull Requests prüfen
        if: >-
          steps.update_state.outputs.pending == 'false' &&
          github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
