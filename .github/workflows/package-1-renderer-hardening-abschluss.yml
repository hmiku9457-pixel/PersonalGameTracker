name: Package 1 - Renderer hardening Abschluss

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fragile Spezialpatches im alten Installer deaktivieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          installer = Path(
              "scripts/applyManifestRendererHardening.mjs"
          )

          if not installer.is_file():
              raise SystemExit(
                  "Der Paket-1-Installer wurde nicht gefunden."
              )

          source = installer.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )

          replacements = {
              "await patchCommsMap();":
                  "// commsMapView wird vom finalen Bootstrap robust gepatcht.",
              "await patchValidator();":
                  "// validateRepository wird vom finalen Bootstrap robust gepatcht.",
              "await patchQualityWorkflow();":
                  "// repository-quality wird vom finalen Bootstrap robust gepatcht."
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(
                      old,
                      new,
                      1
                  )
                  print(
                      f"[OK] Deaktiviert: {old}"
                  )
              elif new in source:
                  print(
                      f"[SKIP] Bereits deaktiviert: {old}"
                  )
              else:
                  raise SystemExit(
                      f"Installer-Aufruf nicht gefunden: {old}"
                  )

          # Idempotenzfehler des ursprünglichen replaceOnce beheben:
          # Erst nach dem Ausgangsblock suchen. Nur wenn dieser nicht
          # mehr existiert, darf der Zieltext als bereits angewendet gelten.
          old_helper = '''    if (
                  after &&
                  source.includes(
                      after
                  )
              ) {
                  console.info(
                      `[SKIP] ${relativeFile}: Änderung bereits vorhanden.`
                  );

                  return;
              }

              const firstIndex =
                  source.indexOf(
                      before
                  );

              if (firstIndex < 0) {
                  throw new Error(
                      `${relativeFile}: erwarteter Ausgangsblock wurde nicht gefunden. Paket passt nicht zum aktuellen Repository-Stand.`
                  );
              }
          '''

          new_helper = '''    const firstIndex =
                  source.indexOf(
                      before
                  );

              if (firstIndex < 0) {
                  if (
                      after &&
                      source.includes(
                          after
                      )
                  ) {
                      console.info(
                          `[SKIP] ${relativeFile}: Änderung bereits vorhanden.`
                      );

                      return;
                  }

                  throw new Error(
                      `${relativeFile}: erwarteter Ausgangsblock wurde nicht gefunden. Paket passt nicht zum aktuellen Repository-Stand.`
                  );
              }
          '''

          if old_helper in source:
              source = source.replace(
                  old_helper,
                  new_helper,
                  1
              )
              print(
                  "[OK] replaceOnce-Idempotenz korrigiert."
              )
          elif new_helper in source:
              print(
                  "[SKIP] replaceOnce-Idempotenz bereits korrigiert."
              )
          else:
              raise SystemExit(
                  "replaceOnce-Implementierung im Installer "
                  "entspricht nicht dem erwarteten Stand."
              )

          installer.write_text(
              source,
              encoding="utf-8"
          )
          PY

      - name: Paket-Skript prüfen
        run: node --check scripts/applyManifestRendererHardening.mjs

      - name: Stabilen Teil von Paket 1 anwenden
        run: node scripts/applyManifestRendererHardening.mjs

      - name: Comms-Map robust aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          target = Path(
              "assets/js/views/commsMapView.js"
          )

          lines = target.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          ).splitlines()

          if any(
              "suppliedViewScope = null" in line
              for line in lines
          ):
              print(
                  "[SKIP] commsMapView.js bereits aktualisiert."
              )
          else:
              function_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() ==
                      "export async function renderCommsMapView("
                  ),
                  None
              )

              if function_index is None:
                  raise SystemExit(
                      "renderCommsMapView()-Signatur wurde nicht gefunden."
                  )

              signature_end = next(
                  (
                      index
                      for index in range(
                          function_index + 1,
                          min(
                              function_index + 20,
                              len(lines)
                          )
                      )
                      if lines[index].strip() == ") {"
                  ),
                  None
              )

              if signature_end is None:
                  raise SystemExit(
                      "Ende der renderCommsMapView()-Signatur "
                      "wurde nicht gefunden."
                  )

              route_index = next(
                  (
                      index
                      for index in range(
                          function_index + 1,
                          signature_end
                      )
                      if lines[index].strip() ==
                      "routeIds"
                  ),
                  None
              )

              if route_index is None:
                  raise SystemExit(
                      "routeIds-Parameter wurde nicht gefunden."
                  )

              indent = (
                  lines[route_index][
                      :len(lines[route_index]) -
                      len(lines[route_index].lstrip())
                  ]
              )

              lines[route_index] = (
                  lines[route_index].rstrip()
                  + ","
              )

              lines.insert(
                  route_index + 1,
                  indent
                  + "suppliedViewScope = null"
              )

              signature_end += 1

              cleanup_comment_index = next(
                  (
                      index
                      for index in range(
                          signature_end + 1,
                          min(
                              signature_end + 50,
                              len(lines)
                          )
                      )
                      if "Map-Ressourcen beim Routenwechsel freigeben."
                      in lines[index]
                  ),
                  None
              )

              if cleanup_comment_index is None:
                  raise SystemExit(
                      "Map-Cleanup-Block wurde nicht gefunden."
                  )

              old_scope_start = next(
                  (
                      index
                      for index in range(
                          cleanup_comment_index,
                          min(
                              cleanup_comment_index + 60,
                              len(lines)
                          )
                      )
                      if lines[index].strip() ==
                      "const viewScope ="
                  ),
                  None
              )

              if old_scope_start is None:
                  raise SystemExit(
                      "Alter viewScope-Block wurde nicht gefunden."
                  )

              if (
                  old_scope_start + 1 >= len(lines) or
                  lines[
                      old_scope_start + 1
                  ].strip() !=
                  "getActiveViewScope();"
              ):
                  raise SystemExit(
                      "Alter viewScope-Block besitzt einen "
                      "unerwarteten Aufbau."
                  )

              del lines[
                  old_scope_start:
                  old_scope_start + 2
              ]

              # Eventuelle direkt folgende Leerzeile entfernen.
              if (
                  old_scope_start < len(lines) and
                  lines[old_scope_start].strip() == ""
              ):
                  del lines[
                      old_scope_start
                  ]

              # Der Scope wird direkt nach der Funktionssignatur
              # erzeugt und anschließend auch für den Cleanup benutzt.
              lines[
                  signature_end + 1:
                  signature_end + 1
              ] = [
                  "\tconst viewScope =",
                  "\t\tsuppliedViewScope ??",
                  "\t\tgetActiveViewScope();",
                  ""
              ]

              cleanup_call_start = next(
                  (
                      index
                      for index in range(
                          cleanup_comment_index,
                          min(
                              cleanup_comment_index + 50,
                              len(lines)
                          )
                      )
                      if lines[index].strip() ==
                      "registerViewCleanup("
                  ),
                  None
              )

              if cleanup_call_start is None:
                  raise SystemExit(
                      "Erster registerViewCleanup()-Aufruf "
                      "wurde nicht gefunden."
                  )

              cleanup_indent = (
                  lines[cleanup_call_start][
                      :len(lines[cleanup_call_start]) -
                      len(lines[cleanup_call_start].lstrip())
                  ]
              )

              cleanup_call_end = next(
                  (
                      index
                      for index in range(
                          cleanup_call_start + 1,
                          min(
                              cleanup_call_start + 30,
                              len(lines)
                          )
                      )
                      if lines[index] ==
                      cleanup_indent + ");"
                  ),
                  None
              )

              if cleanup_call_end is None:
                  raise SystemExit(
                      "Ende des ersten registerViewCleanup()-Aufrufs "
                      "wurde nicht gefunden."
                  )

              active_scope_index = next(
                  (
                      index
                      for index in range(
                          cleanup_call_start,
                          cleanup_call_end + 1
                      )
                      if lines[index].strip() ==
                      "getActiveViewScope()"
                  ),
                  None
              )

              if active_scope_index is None:
                  raise SystemExit(
                      "getActiveViewScope() im Cleanup "
                      "wurde nicht gefunden."
                  )

              active_indent = (
                  lines[active_scope_index][
                      :len(lines[active_scope_index]) -
                      len(lines[active_scope_index].lstrip())
                  ]
              )

              lines[
                  active_scope_index
              ] = (
                  active_indent
                  + "viewScope"
              )

              target.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

              print(
                  "[OK] commsMapView.js aktualisiert."
              )
          PY

      - name: Repository-Validator robust aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          target = Path(
              "scripts/validateRepository.mjs"
          )

          lines = target.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          ).splitlines()

          # -------------------------------------------------
          # 1. Zentrale Renderer-Konfiguration importieren
          # -------------------------------------------------
          if not any(
              "resolveManifestRendererConfiguration"
              in line
              for line in lines
          ):
              path_import_end = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() ==
                      '} from "node:path";'
                  ),
                  None
              )

              if path_import_end is None:
                  raise SystemExit(
                      'node:path-Importende wurde nicht gefunden.'
                  )

              lines[
                  path_import_end + 1:
                  path_import_end + 1
              ] = [
                  "",
                  "import {",
                  "    resolveManifestRendererConfiguration",
                  '} from "../assets/js/config/manifestRendererConfig.js";'
              ]

              print(
                  "[OK] Renderer-Konfiguration importiert."
              )

          # -------------------------------------------------
          # 2. validateManifestTree erhält Routenkontext
          # -------------------------------------------------
          function_index = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() ==
                  "async function validateManifestTree({"
              ),
              None
          )

          if function_index is None:
              raise SystemExit(
                  "validateManifestTree() wurde nicht gefunden."
              )

          signature_end = next(
              (
                  index
                  for index in range(
                      function_index + 1,
                      min(
                          function_index + 15,
                          len(lines)
                      )
                  )
                  if lines[index].strip() ==
                  "}) {"
              ),
              None
          )

          if signature_end is None:
              raise SystemExit(
                  "validateManifestTree()-Signaturende "
                  "wurde nicht gefunden."
              )

          if not any(
              "routeEntry = null" in lines[index]
              for index in range(
                  function_index,
                  signature_end + 1
              )
          ):
              stack_index = next(
                  (
                      index
                      for index in range(
                          function_index + 1,
                          signature_end
                      )
                      if lines[index].strip() ==
                      "stack"
                  ),
                  None
              )

              if stack_index is None:
                  raise SystemExit(
                      "stack-Parameter wurde nicht gefunden."
                  )

              param_indent = (
                  lines[stack_index][
                      :len(lines[stack_index]) -
                      len(lines[stack_index].lstrip())
                  ]
              )

              lines[stack_index] = (
                  lines[stack_index].rstrip()
                  + ","
              )

              lines[
                  stack_index + 1:
                  stack_index + 1
              ] = [
                  param_indent
                  + "routeEntry = null,",
                  param_indent
                  + "routeEntryFile = null"
              ]

              signature_end += 2

              print(
                  "[OK] validateManifestTree()-Routenkontext ergänzt."
              )

          # -------------------------------------------------
          # 3. Zentralen Renderer-Vertrag pro Manifest prüfen
          # -------------------------------------------------
          if not any(
              line.strip() ==
              "const rendererConfiguration ="
              for line in lines
          ):
              object_id_index = next(
                  (
                      index
                      for index in range(
                          signature_end,
                          len(lines)
                      )
                      if lines[index].strip() ==
                      'validateObjectId(manifest, manifestFile, "Manifest", false);'
                  ),
                  None
              )

              if object_id_index is None:
                  raise SystemExit(
                      "Manifest-validateObjectId()-Anker "
                      "wurde nicht gefunden."
                  )

              block = [
                  "",
                  "    const rendererConfiguration =",
                  "        resolveManifestRendererConfiguration({",
                  "            entry:",
                  "                routeEntry,",
                  "            manifest",
                  "        });",
                  "",
                  "    for (",
                  "        const issue",
                  "        of rendererConfiguration.issues",
                  "    ) {",
                  "        const routeSource =",
                  "            routeEntryFile",
                  '                ? ` (Route aus ${display(routeEntryFile)})`',
                  '                : "";',
                  "",
                  "        errors.push(",
                  '            `${display(manifestFile)}${routeSource}: ${issue.message}`',
                  "        );",
                  "    }",
                  "",
                  "    if (",
                  "        rendererConfiguration.rendererName ===",
                  '        "comms"',
                  "    ) {",
                  "        validateCommsManifest(",
                  "            manifest,",
                  "            manifestFile",
                  "        );",
                  "    }"
              ]

              lines[
                  object_id_index + 1:
                  object_id_index + 1
              ] = block

              print(
                  "[OK] Zentraler Renderer-Vertrag eingebunden."
              )

          # -------------------------------------------------
          # 4. Route-Entry an rekursive Manifeste weitergeben
          # -------------------------------------------------
          if not any(
              line.strip() ==
              "routeEntry:"
              for line in lines
          ):
              recursive_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() ==
                      "const childTotal = await validateManifestTree({"
                  ),
                  None
              )

              if recursive_index is None:
                  raise SystemExit(
                      "Rekursiver validateManifestTree()-Aufruf "
                      "wurde nicht gefunden."
                  )

              recursive_end = next(
                  (
                      index
                      for index in range(
                          recursive_index + 1,
                          min(
                              recursive_index + 15,
                              len(lines)
                          )
                      )
                      if lines[index].strip() ==
                      "});"
                  ),
                  None
              )

              if recursive_end is None:
                  raise SystemExit(
                      "Ende des rekursiven Manifest-Aufrufs "
                      "wurde nicht gefunden."
                  )

              stack_index = next(
                  (
                      index
                      for index in range(
                          recursive_index + 1,
                          recursive_end
                      )
                      if lines[index].strip() ==
                      "stack: [...stack, manifestFile]"
                  ),
                  None
              )

              if stack_index is None:
                  raise SystemExit(
                      "Rekursiver stack-Anker wurde nicht gefunden."
                  )

              call_indent = (
                  lines[stack_index][
                      :len(lines[stack_index]) -
                      len(lines[stack_index].lstrip())
                  ]
              )

              lines[stack_index] = (
                  lines[stack_index].rstrip()
                  + ","
              )

              lines[
                  stack_index + 1:
                  stack_index + 1
              ] = [
                  call_indent
                  + "routeEntry:",
                  call_indent
                  + "    category,",
                  call_indent
                  + "routeEntryFile:",
                  call_indent
                  + "    manifestFile"
              ]

              print(
                  "[OK] Rekursiver Routenkontext ergänzt."
              )

          # -------------------------------------------------
          # 5. Alte direkte Renderer-Prüfung entfernen
          # -------------------------------------------------
          legacy_renderer_line = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() ==
                  'typeof manifest.renderer === "string" &&'
              ),
              None
          )

          if legacy_renderer_line is not None:
              block_start = legacy_renderer_line

              while (
                  block_start > 0 and
                  lines[block_start].strip() !=
                  "if ("
              ):
                  block_start -= 1

              block_end = legacy_renderer_line

              while (
                  block_end < len(lines) and
                  lines[block_end].strip() !=
                  "}"
              ):
                  block_end += 1

              if (
                  block_start < 0 or
                  block_end >= len(lines)
              ):
                  raise SystemExit(
                      "Alte direkte Renderer-Prüfung "
                      "konnte nicht abgegrenzt werden."
                  )

              del lines[
                  block_start:
                  block_end + 1
              ]

              if (
                  block_start < len(lines) and
                  lines[block_start].strip() == ""
              ):
                  del lines[
                      block_start
                  ]

              print(
                  "[OK] Alte direkte Renderer-Prüfung entfernt."
              )

          # -------------------------------------------------
          # 6. Comms-Legacy-Prüfung vereinfachen
          # -------------------------------------------------
          comms_start = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() ==
                  "function validateCommsManifest(manifest, file) {"
              ),
              None
          )

          if comms_start is None:
              raise SystemExit(
                  "validateCommsManifest() wurde nicht gefunden."
              )

          declared_start = next(
              (
                  index
                  for index in range(
                      comms_start + 1,
                      len(lines)
                  )
                  if lines[index].strip().startswith(
                      "function validateDeclaredCount("
                  )
              ),
              None
          )

          if declared_start is None:
              raise SystemExit(
                  "Folgefunktion validateDeclaredCount() "
                  "wurde nicht gefunden."
              )

          clean_comms_function = [
              "function validateCommsManifest(manifest, file) {",
              "    if (Array.isArray(manifest.sections)) {",
              "        errors.push(",
              "            `${display(file)} verwendet weiterhin das entfernte sections-Feld.`",
              "        );",
              "    }",
              "",
              "    if (Array.isArray(manifest.files)) {",
              "        errors.push(",
              "            `${display(file)} verwendet weiterhin das entfernte files-Feld.`",
              "        );",
              "    }",
              "",
              "    for (const category of manifest.categories ?? []) {",
              '        if (typeof category?.manifest === "string") {',
              "            errors.push(",
              '                `${display(file)}: Comms-Eintrag "${category.id}" verwendet weiterhin manifest statt file.`',
              "            );",
              "        }",
              "    }",
              "}",
              ""
          ]

          current_comms = lines[
              comms_start:
              declared_start
          ]

          if current_comms != clean_comms_function:
              lines[
                  comms_start:
                  declared_start
              ] = clean_comms_function

              print(
                  "[OK] Comms-Legacy-Prüfung zentralisiert."
              )

          # -------------------------------------------------
          # 7. Runtime-Guard gegen allMissions-Fallback
          # -------------------------------------------------
          if not any(
              "stillen allMissions-Fallback"
              in line
              for line in lines
          ):
              section_rule_message = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if "Comms-View verwendet das entfernte files-Feld."
                      in line
                  ),
                  None
              )

              if section_rule_message is None:
                  raise SystemExit(
                      "Comms-View-Runtime-Regel "
                      "wurde nicht gefunden."
                  )

              rule_end = next(
                  (
                      index
                      for index in range(
                          section_rule_message,
                          min(
                              section_rule_message + 10,
                              len(lines)
                          )
                      )
                      if lines[index].strip() ==
                      "},"
                  ),
                  None
              )

              if rule_end is None:
                  raise SystemExit(
                      "Ende der Comms-View-Runtime-Regel "
                      "wurde nicht gefunden."
                  )

              fallback_rule = [
                  "        {",
                  '            file: "assets/js/views/commsOverviewView.js",',
                  '            text: "\\"allMissions.json\\"",',
                  '            message: "Comms-View enthält weiterhin den stillen allMissions-Fallback."',
                  "        },"
              ]

              lines[
                  rule_end + 1:
                  rule_end + 1
              ] = fallback_rule

              print(
                  "[OK] allMissions-Fallback-Guard ergänzt."
              )

          # -------------------------------------------------
          # 8. Neue Systemdateien als required markieren
          # -------------------------------------------------
          required_files = [
              "assets/js/config/manifestRendererConfig.js",
              "tests/unit/manifestRendererConfig.test.mjs",
              "tests/e2e/manifest-renderer-contract.spec.mjs"
          ]

          missing_required = [
              file
              for file in required_files
              if not any(
                  f'"{file}"' in line
                  for line in lines
              )
          ]

          if missing_required:
              progress_required_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() ==
                      '"assets/js/services/progressSummaryService.js",'
                  ),
                  None
              )

              if progress_required_index is None:
                  raise SystemExit(
                      "Required-Dateiliste wurde nicht gefunden."
                  )

              insertion = []

              if (
                  "assets/js/config/manifestRendererConfig.js"
                  in missing_required
              ):
                  insertion.append(
                      '        "assets/js/config/manifestRendererConfig.js",'
                  )

              registry_index = next(
                  (
                      index
                      for index in range(
                          progress_required_index,
                          min(
                              progress_required_index + 15,
                              len(lines)
                          )
                      )
                      if lines[index].strip() ==
                      '"assets/js/views/manifestViewRegistry.js",'
                  ),
                  None
              )

              if registry_index is None:
                  raise SystemExit(
                      "manifestViewRegistry.js in Required-Liste "
                      "wurde nicht gefunden."
                  )

              if insertion:
                  lines[
                      progress_required_index + 1:
                      progress_required_index + 1
                  ] = insertion

                  registry_index += len(
                      insertion
                  )

              test_insertion = []

              if (
                  "tests/unit/manifestRendererConfig.test.mjs"
                  in missing_required
              ):
                  test_insertion.append(
                      '        "tests/unit/manifestRendererConfig.test.mjs",'
                  )

              if (
                  "tests/e2e/manifest-renderer-contract.spec.mjs"
                  in missing_required
              ):
                  test_insertion.append(
                      '        "tests/e2e/manifest-renderer-contract.spec.mjs",'
                  )

              if test_insertion:
                  lines[
                      registry_index + 1:
                      registry_index + 1
                  ] = test_insertion

              print(
                  "[OK] Neue Systemdateien als required ergänzt."
              )

          target.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Repository-Quality robust aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          target = Path(
              ".github/workflows/repository-quality.yml"
          )

          lines = target.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          ).splitlines()

          # -------------------------------------------------
          # 1. Bootstrap-Dateien bei Pushes ignorieren
          # -------------------------------------------------
          if not any(
              ".github/workflows/package-*.yml" in line
              for line in lines
          ):
              push_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line == "  push:"
                  ),
                  None
              )

              if push_index is None:
                  raise SystemExit(
                      "push:-Trigger wurde nicht gefunden."
                  )

              pull_request_index = next(
                  (
                      index
                      for index in range(
                          push_index + 1,
                          len(lines)
                      )
                      if lines[index] == "  pull_request:"
                  ),
                  None
              )

              if pull_request_index is None:
                  raise SystemExit(
                      "pull_request:-Trigger wurde nicht gefunden."
                  )

              lines[
                  pull_request_index:
                  pull_request_index
              ] = [
                  "    paths-ignore:",
                  '      - ".github/workflows/package-*.yml"',
                  '      - "tools/update-packages/**"'
              ]

              print(
                  "[OK] Bootstrap-Pfade aus Push-Quality ausgenommen."
              )
          else:
              print(
                  "[SKIP] Bootstrap-Pfade bereits ausgenommen."
              )

          # -------------------------------------------------
          # 2. Unit-Test-Schritt ergänzen
          # -------------------------------------------------
          if not any(
              line.strip() ==
              "- name: Unit-Tests ausführen"
              for line in lines
          ):
              syntax_index = next(
                  (
                      index
                      for index, line in enumerate(lines)
                      if line.strip() ==
                      "- name: JavaScript-Syntax prüfen"
                  ),
                  None
              )

              if syntax_index is None:
                  raise SystemExit(
                      "JavaScript-Syntax-Schritt wurde nicht gefunden."
                  )

              lines[
                  syntax_index:
                  syntax_index
              ] = [
                  "      - name: Unit-Tests ausführen",
                  "        run: npm run test:unit",
                  ""
              ]

              print(
                  "[OK] Unit-Tests in Repository-Quality ergänzt."
              )
          else:
              print(
                  "[SKIP] Unit-Test-Schritt bereits vorhanden."
              )

          target.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: Unit-Tests ausführen
        run: npm run test:unit

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find assets scripts tests \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -print0
          )

      - name: Browser-Tests ausführen
        run: npm run test:e2e

      - name: Paketdateien aufräumen
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            scripts/applyManifestRendererHardening.mjs \
            .github/workflows/manifest-renderer-hardening.yml \
            .github/workflows/package-1-renderer-hardening-fix.yml \
            .github/workflows/package-1-renderer-hardening-final.yml \
            .github/workflows/package-1-renderer-hardening-final-v2.yml \
            .github/workflows/package-1-renderer-hardening-abschluss.yml

      - name: Diff prüfen
        run: git diff --check

      - name: Änderungen gesammelt committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Harden manifest renderer contract"
          git push
