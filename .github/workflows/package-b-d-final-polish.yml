name: Priority B-D - Final polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prioritaet B bis D anwenden
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          GAMES_VIEW = Path(
              "assets/js/views/gamesView.js"
          )
          GAME_VIEW = Path(
              "assets/js/views/gameView.js"
          )
          RENDERER_CONFIG = Path(
              "assets/js/config/manifestRendererConfig.js"
          )
          GITIGNORE = Path(
              ".gitignore"
          )


          def read(path):
              return path.read_text(
                  encoding="utf-8"
              ).replace(
                  "\r\n",
                  "\n"
              )


          def write(path, content):
              path.write_text(
                  content.rstrip() + "\n",
                  encoding="utf-8"
              )
              print(
                  f"[WRITE] {path}"
              )


          def set_named_import(
              source,
              module_path,
              names,
              insert_before_module=None
          ):
              pattern = re.compile(
                  r'import\s*\{[\s\S]*?\}\s*from\s*"'
                  + re.escape(module_path)
                  + r'";'
              )

              replacement = (
                  "import {\n"
                  + ",\n".join(
                      f"\t{name}"
                      for name in names
                  )
                  + f'\n}} from "{module_path}";'
              )

              matches = list(
                  pattern.finditer(
                      source
                  )
              )

              if len(matches) == 1:
                  match = matches[0]

                  return (
                      source[:match.start()]
                      + replacement
                      + source[match.end():]
                  )

              if len(matches) > 1:
                  raise SystemExit(
                      f"Import {module_path}: mehrfach gefunden."
                  )

              if not insert_before_module:
                  raise SystemExit(
                      f"Import {module_path}: nicht gefunden."
                  )

              anchor_pattern = re.compile(
                  r'import\s*\{[\s\S]*?\}\s*from\s*"'
                  + re.escape(insert_before_module)
                  + r'";'
              )

              anchor = anchor_pattern.search(
                  source
              )

              if not anchor:
                  raise SystemExit(
                      f"Importanker {insert_before_module}: nicht gefunden."
                  )

              return (
                  source[:anchor.start()]
                  + replacement
                  + "\n\n"
                  + source[anchor.start():]
              )


          def remove_section_to_next(
              source,
              start_title,
              next_title
          ):
              start_pattern = re.compile(
                  r'/\* -+\n'
                  r'\s*'
                  + re.escape(start_title)
                  + r'\n'
                  r'\s*-+ \*/'
              )

              next_pattern = re.compile(
                  r'/\* -+\n'
                  r'\s*'
                  + re.escape(next_title)
                  + r'\n'
                  r'\s*-+ \*/'
              )

              start_match = start_pattern.search(
                  source
              )

              if not start_match:
                  return source

              next_match = next_pattern.search(
                  source,
                  start_match.end()
              )

              if not next_match:
                  raise SystemExit(
                      f"Abschnitt {start_title}: Folgemarker fehlt."
                  )

              return (
                  source[:start_match.start()]
                  + source[next_match.start():]
              )


          def remove_section_to_eof(
              source,
              title
          ):
              pattern = re.compile(
                  r'/\* -+\n'
                  r'\s*'
                  + re.escape(title)
                  + r'\n'
                  r'\s*-+ \*/'
              )

              match = pattern.search(
                  source
              )

              if not match:
                  return source

              return (
                  source[:match.start()].rstrip()
                  + "\n"
              )


          # =========================================================
          # B. Spiele-Gesamtfortschritt über aktuelle Item-IDs
          # =========================================================

          games_view = read(
              GAMES_VIEW
          )

          games_view = set_named_import(
              games_view,
              "../services/dataService.js",
              [
                  "loadGameManifest",
                  "loadGames"
              ]
          )

          games_view = set_named_import(
              games_view,
              "../services/progressService.js",
              [
                  "loadGameProgressData"
              ]
          )

          games_view = set_named_import(
              games_view,
              "../services/routeHashService.js",
              [
                  "buildGameHash"
              ],
              insert_before_module=
                  "../services/languageService.js"
          )


          function_start = games_view.find(
              "async function loadGameCardProgress("
          )

          function_end = games_view.find(
              "/* ---------------------------------------------------------\n"
              "   8. Fortschrittsberechnung",
              function_start
          )

          if (
              function_start < 0 or
              function_end < 0
          ):
              raise SystemExit(
                  "gamesView: loadGameCardProgress konnte nicht abgegrenzt werden."
              )

          function_block = games_view[
              function_start:
              function_end
          ]

          progress_start = function_block.find(
              "\t\tconst manifestItemCount ="
          )

          update_start = function_block.find(
              "\t\tupdateGameCardProgress("
          )

          if (
              progress_start >= 0 and
              update_start > progress_start
          ):
              replacement = '''\t\tconst progress =
          \t\t\tawait calculateManifestProgressFromMetadata(
          \t\t\t\tgame.id,
          \t\t\t\tmanifest,
          \t\t\t\t"manifest.json",
          \t\t\t\tprogressData
          \t\t\t);

          '''

              function_block = (
                  function_block[:progress_start]
                  + replacement
                  + function_block[update_start:]
              )

              games_view = (
                  games_view[:function_start]
                  + function_block
                  + games_view[function_end:]
              )
          elif (
              'await calculateManifestProgressFromMetadata('
              not in function_block
          ):
              raise SystemExit(
                  "gamesView: Fortschrittsberechnung besitzt einen unerwarteten Zustand."
              )


          games_view = remove_section_to_next(
              games_view,
              "8. Fortschrittsberechnung",
              "9. Fortschrittsanzeige aktualisieren"
          )

          games_view = games_view.replace(
              "   9. Fortschrittsanzeige aktualisieren",
              "   8. Fortschrittsanzeige aktualisieren",
              1
          )


          # =========================================================
          # C. Zentrale Hash-Routen
          # =========================================================

          games_view = remove_section_to_eof(
              games_view,
              "10. Spielroute erzeugen"
          )

          for stale in [
              "function calculateManifestProgress(",
              "function calculateEntryProgress(",
              "function buildGameHash("
          ]:
              if stale in games_view:
                  raise SystemExit(
                      "gamesView enthält weiterhin Altlogik: "
                      + stale
                  )

          write(
              GAMES_VIEW,
              games_view
          )


          game_view = read(
              GAME_VIEW
          )

          game_view = set_named_import(
              game_view,
              "../services/routeHashService.js",
              [
                  "buildGameHash"
              ],
              insert_before_module=
                  "../services/dataService.js"
          )

          game_view = remove_section_to_eof(
              game_view,
              "7. Routing"
          )

          if (
              "function buildGameHash("
              in game_view
          ):
              raise SystemExit(
                  "gameView enthält weiterhin lokale Routinglogik."
              )

          write(
              GAME_VIEW,
              game_view
          )


          # =========================================================
          # D. Kosmetische Altlasten
          # =========================================================

          renderer_config = read(
              RENDERER_CONFIG
          )

          renderer_config = renderer_config.replace(
              '''/**
           * Zentrale Definition aller spezialisierten Manifest-Renderer.
           *
           * Diese Datei enthält absichtlich ausschließlich browser- und
           * Node-kompatible Datenlogik. Dadurch verwenden Runtime und
           * Repository-Validator denselben Renderer-Vertrag.
           */''',
              '''/**
           * Zentrale Definition aller spezialisierten Manifest-Renderer.
           *
           * Die Konfiguration hält den Renderer-Vertrag an einer
           * gemeinsamen Stelle für die Runtime fest.
           */''',
              1
          )

          if (
              "Repository-Validator"
              in renderer_config
          ):
              raise SystemExit(
                  "manifestRendererConfig enthält weiterhin den alten Validator-Hinweis."
              )

          write(
              RENDERER_CONFIG,
              renderer_config
          )


          gitignore = read(
              GITIGNORE
          )

          gitignore = gitignore.replace(
              '''# Playwright und Performance-Messungen
          playwright-report/
          test-results/
          artifacts/

          ''',
              "",
              1
          )

          gitignore = gitignore.replace(
              '''# Playwright und Performance-Messungen
          playwright-report/
          test-results/
          artifacts/
          ''',
              "",
              1
          )

          write(
              GITIGNORE,
              gitignore
          )


          print(
              "Priorität B-D erfolgreich angewendet."
          )
          PY

      - name: Aenderungen committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .gitignore \
            assets/js/views/gamesView.js \
            assets/js/views/gameView.js \
            assets/js/config/manifestRendererConfig.js

          if git diff --cached --quiet; then
            echo "Keine Aenderungen erforderlich."
            exit 0
          fi

          git commit -m "Polish progress routing and cleanup [skip ci]"
          git push
