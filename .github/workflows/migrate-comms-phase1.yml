name: Migrate Division 2 Comms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-comms:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comms migrieren
        run: node scripts/migrateCommsPhase1.mjs

      - name: Änderungen prüfen
        run: git status

      - name: Erzeugte Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/theDivision2/collectibles/commsV2

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Generate regional Division 2 comms structure"
            git push
          fi
