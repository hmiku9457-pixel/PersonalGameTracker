name: Package 1 - Renderer hardening push safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fragile Spezialpatches im alten Installer deaktivieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          installer = Path(
              "scripts/applyManifestRendererHardening.mjs"
          )

          if not installer.is_file():
              raise SystemExit(
                  "Der Paket-1-Installer wurde nicht gefunden."
              )

          source = installer.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )

          replacements = {
              "await patchCommsMap();":
                  "// commsMapView wird vom finalen Bootstrap robust gepatcht.",
              "await patchValidator();":
                  "// validateRepository wird vom finalen Bootstrap robust gepatcht.",
              "await patchQualityWorkflow();":
                  "// repository-quality wird vom finalen Bootstrap robust gepatcht."
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(
                      old,
                      new,
                      1
                  )
                  print(
                      f"[OK] Deaktiviert: {old}"
                  )
              elif new in source:
                  print(
                      f"[SKIP] Bereits deaktiviert: {old}"
                  )
              else:
                  raise SystemExit(
                      f"Installer-Aufruf nicht gefunden: {old}"
                  )

          # Idempotenzfehler des ursprünglichen replaceOnce beheben:
          # Erst nach dem Ausgangsblock suchen. Nur wenn dieser nicht
          # mehr existiert, darf der Zieltext als bereits angewendet gelten.
          old_helper = '''    if (
                  after &&
                  source.includes(
                      after
                  )
              ) {
                  console.info(
                      `[SKIP] ${relativeFile}: Änderung bereits vorhanden.`
                  );

                  return;
              }

              const firstIndex =
                  source.indexOf(
                      before
                  );

              if (firstIndex < 0) {
                  throw new Error(
                      `${relativeFile}: erwarteter Ausgangsblock wurde nicht gefunden. Paket passt nicht zum aktuellen Repository-Stand.`
                  );
              }
          '''

          new_helper = '''    const firstIndex =
                  source.indexOf(
                      before
                  );

              if (firstIndex < 0) {
                  if (
                      after &&
                      source.includes(
                          after
                      )
                  ) {
                      console.info(
                          `[SKIP] ${relativeFile}: Änderung bereits vorhanden.`
                      );

                      return;
                  }

                  throw new Error(
                      `${relativeFile}: erwarteter Ausgangsblock wurde nicht gefunden. Paket passt nicht zum aktuellen Repository-Stand.`
                  );
              }
          '''

          if old_helper in source:
              source = source.replace(
                  old_helper,
                  new_helper,
                  1
              )
              print(
                  "[OK] replaceOnce-Idempotenz korrigiert."
              )
          elif new_helper in source:
              print(
                  "[SKIP] replaceOnce-Idempotenz bereits korrigiert."
              )
          else:
              raise SystemExit(
                  "replaceOnce-Implementierung im Installer "
                  "entspricht nicht dem erwarteten Stand."
              )

          installer.write_text(
              source,
              encoding="utf-8"
          )
          PY

      - name: Paket-Skript prüfen
        run: node --check scripts/applyManifestRendererHardening.mjs

      - name: Stabilen Teil von Paket 1 anwenden
        run: node scripts/applyManifestRendererHardening.mjs

      - name: Comms-Map robust aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          target = Path(
              "assets/js/views/commsMapView.js"
          )

          source = target.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )

          if (
              "suppliedViewScope = null" in source and
              re.search(
                  r"registerViewCleanup\([\s\S]*?,\s*viewScope\s*\);",
                  source
              )
          ):
              print(
                  "[SKIP] commsMapView.js bereits aktualisiert."
              )
              raise SystemExit(0)

          pattern = re.compile(
              r'''export async function renderCommsMapView\(
                  (?P<params>[\s\S]*?)
                  \)\s*\{
                  (?P<body>[\s\S]*?)
                  \tconst fallbackController\s*=
              ''',
              re.VERBOSE
          )

          match = pattern.search(
              source
          )

          if not match:
              raise SystemExit(
                  "renderCommsMapView()-Kopf konnte nicht "
                  "strukturell erkannt werden."
              )

          params = match.group(
              "params"
          ).rstrip()

          if not params.endswith(
              "routeIds"
          ):
              raise SystemExit(
                  "Unerwartete renderCommsMapView()-Parameter."
              )

          params = (
              params
              + ",\n"
              + "    suppliedViewScope = null\n"
          )

          body = match.group(
              "body"
          )

          old_scope = re.compile(
              r'''\n?
                  \tconst\ viewScope\s*=\s*
                  \t\tgetActiveViewScope\(\);
                  \s*
              ''',
              re.VERBOSE
          )

          body, scope_count = old_scope.subn(
              "\n",
              body,
              count=1
          )

          if scope_count != 1:
              raise SystemExit(
                  "Der bisherige viewScope-Block wurde nicht "
                  "eindeutig gefunden."
              )

          cleanup_scope = re.compile(
              r'''(
                  /\*\ Map-Ressourcen\ beim\ Routenwechsel\ freigeben\.\ \*/
                  [\s\S]*?
                  registerViewCleanup\(
                  [\s\S]*?
              )
              getActiveViewScope\(\)
              (\s*\);)
              ''',
              re.VERBOSE
          )

          body, cleanup_count = cleanup_scope.subn(
              r"\1viewScope\2",
              body,
              count=1
          )

          if cleanup_count != 1:
              raise SystemExit(
                  "Der Cleanup-viewScope konnte nicht "
                  "eindeutig ersetzt werden."
              )

          body = (
              "\n"
              + "\tconst viewScope =\n"
              + "\t\tsuppliedViewScope ??\n"
              + "\t\tgetActiveViewScope();\n"
              + body.lstrip("\n")
          )

          replacement = (
              "export async function renderCommsMapView(\n"
              + params
              + ") {"
              + body
              + "\n\tconst fallbackController ="
          )

          updated = (
              source[:match.start()]
              + replacement
              + source[match.end():]
          )

          target.write_text(
              updated,
              encoding="utf-8"
          )

          print(
              "[OK] commsMapView.js robust aktualisiert."
          )
          PY

      - name: Repository-Validator robust aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          target = Path(
              "scripts/validateRepository.mjs"
          )

          source = target.read_text(
              encoding="utf-8"
          ).replace(
              "\r\n",
              "\n"
          )

          def replace_once(
              text,
              old,
              new,
              label
          ):
              count = text.count(
                  old
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: erwartete genau 1 Fundstelle, "
                      f"gefunden: {count}"
                  )

              return text.replace(
                  old,
                  new,
                  1
              )

          # Gemeinsame Runtime-/Validator-Konfiguration importieren.
          renderer_import = '''import {
              resolveManifestRendererConfiguration
          } from "../assets/js/config/manifestRendererConfig.js";
          '''

          if (
              "resolveManifestRendererConfiguration" not in source
          ):
              anchor = '''} from "node:path";
          '''

              source = replace_once(
                  source,
                  anchor,
                  anchor
                  + "\n"
                  + renderer_import,
                  "Renderer-Import"
              )

          # Routenkontext an rekursive Manifestvalidierung weitergeben.
          if (
              "routeEntry = null" not in source
          ):
              signature_pattern = re.compile(
                  r'''async function validateManifestTree\(\{
                      \s*gameId,
                      \s*manifestFile,
                      \s*stack
                      \s*\}\)\s*\{
                  ''',
                  re.VERBOSE
              )

              source, count = signature_pattern.subn(
                  '''async function validateManifestTree({
              gameId,
              manifestFile,
              stack,
              routeEntry = null,
              routeEntryFile = null
          }) {''',
                  source,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "validateManifestTree()-Signatur "
                      "konnte nicht eindeutig erweitert werden."
                  )

          if (
              "const rendererConfiguration =" not in source
          ):
              anchor = (
                  '    validateObjectId('
                  'manifest, manifestFile, "Manifest", false'
                  ');'
              )

              block = '''    const rendererConfiguration =
              resolveManifestRendererConfiguration({
                  entry:
                      routeEntry,
                  manifest
              });

          for (
              const issue
              of rendererConfiguration.issues
          ) {
              const routeSource =
                  routeEntryFile
                      ? ` (Route aus ${display(routeEntryFile)})`
                      : "";

              errors.push(
                  `${display(manifestFile)}${routeSource}: ${issue.message}`
              );
          }

          if (
              rendererConfiguration.rendererName ===
              "comms"
          ) {
              validateCommsManifest(
                  manifest,
                  manifestFile
              );
          }
          '''

              source = replace_once(
                  source,
                  anchor,
                  anchor
                  + "\n\n"
                  + block.rstrip(),
                  "Renderer-Konfigurationsblock"
              )

          if (
              "routeEntry:\n                    category" not in source
          ):
              recursive_pattern = re.compile(
                  r'''const childTotal = await validateManifestTree\(\{
                      \s*gameId,
                      \s*manifestFile:\s*target,
                      \s*stack:\s*\[\.\.\.stack,\s*manifestFile\]
                      \s*\}\);
                  ''',
                  re.VERBOSE
              )

              replacement = '''const childTotal = await validateManifestTree({
                  gameId,
                  manifestFile: target,
                  stack: [...stack, manifestFile],
                  routeEntry:
                      category,
                  routeEntryFile:
                      manifestFile
              });'''

              source, count = recursive_pattern.subn(
                  replacement,
                  source,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Rekursiver validateManifestTree()-Aufruf "
                      "konnte nicht eindeutig erweitert werden."
                  )

          # Alte renderer-spezifische Einzelprüfung entfernen.
          old_renderer_check = re.compile(
              r'''\n
                  \s*if\s*\(
                  \s*typeof\s+manifest\.renderer\s*===\s*"string"\s*&&
                  \s*manifest\.renderer\s*===\s*"comms"
                  \s*\)\s*\{
                  \s*validateCommsManifest\(
                      manifest,\s*manifestFile
                  \);
                  \s*\}
              ''',
              re.VERBOSE
          )

          source, old_renderer_count = old_renderer_check.subn(
              "",
              source,
              count=1
          )

          if (
              old_renderer_count == 0 and
              'manifest.renderer === "comms"' in source
          ):
              raise SystemExit(
                  "Alte direkte Comms-Renderer-Prüfung "
                  "konnte nicht entfernt werden."
              )

          # Comms-spezifische Legacy-Prüfung behält nur noch
          # tatsächlich Comms-spezifische Altstrukturen.
          start = source.find(
              "function validateCommsManifest("
          )
          end = source.find(
              "\nfunction validateDeclaredCount(",
              start
          )

          if (
              start < 0 or
              end < 0
          ):
              raise SystemExit(
                  "validateCommsManifest()-Bereich "
                  "konnte nicht gefunden werden."
              )

          segment = source[
              start:end
          ]

          allowed_block = '''    const allowedViews = new Set([
              "comms-overview",
              "map",
              "list"
          ]);

          if (
              typeof manifest.view === "string" &&
              !allowedViews.has(manifest.view)
          ) {
              errors.push(
                  `${display(file)} verwendet die unbekannte Comms-View "${manifest.view}".`
              );
          }
          if (
              allowedViews.has(manifest.view) &&
              manifest.renderer !== "comms"
          ) {
              errors.push(
                  `${display(file)} benötigt für die View "${manifest.view}" renderer "comms".`
              );
          }

          '''

          if allowed_block in segment:
              segment = segment.replace(
                  allowed_block,
                  "",
                  1
              )
          elif "const allowedViews" in segment:
              raise SystemExit(
                  "allowedViews-Altblock besitzt einen "
                  "unerwarteten Aufbau."
              )

          category_renderer_block = '''        if (
                  allowedViews.has(category?.view) &&
                  category.renderer !== "comms"
              ) {
                  errors.push(
                      `${display(file)}: Comms-Eintrag "${category.id}" benötigt renderer "comms".`
                  );
              }
          '''

          if category_renderer_block in segment:
              segment = segment.replace(
                  category_renderer_block,
                  "",
                  1
              )
          elif "allowedViews.has(category?.view)" in segment:
              raise SystemExit(
                  "Kategorie-Renderer-Altblock besitzt "
                  "einen unerwarteten Aufbau."
              )

          source = (
              source[:start]
              + segment
              + source[end:]
          )

          # Verhindern, dass der alte Missions-Fallback zurückkehrt.
          fallback_rule = '''        {
              file: "assets/js/views/commsOverviewView.js",
              text: "\\"allMissions.json\\"",
              message: "Comms-View enthält weiterhin den stillen allMissions-Fallback."
          },
          '''

          if (
              "stillen allMissions-Fallback" not in source
          ):
              anchor = '''        {
              file: "assets/js/views/commsOverviewView.js",
              text: "sectionManifest.files",
              message: "Comms-View verwendet das entfernte files-Feld."
          },
          '''

              source = replace_once(
                  source,
                  anchor,
                  anchor
                  + fallback_rule,
                  "allMissions-Runtime-Regel"
              )

          # Neue Systemdateien als verpflichtend markieren.
          required_anchor = '''        "assets/js/services/progressSummaryService.js",
              "assets/js/views/manifestViewRegistry.js",
          '''

          required_replacement = '''        "assets/js/services/progressSummaryService.js",
              "assets/js/config/manifestRendererConfig.js",
              "assets/js/views/manifestViewRegistry.js",
              "tests/unit/manifestRendererConfig.test.mjs",
              "tests/e2e/manifest-renderer-contract.spec.mjs",
          '''

          if (
              '"assets/js/config/manifestRendererConfig.js"' not in source
          ):
              source = replace_once(
                  source,
                  required_anchor,
                  required_replacement,
                  "Required-Systemdateien"
              )

          target.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "[OK] validateRepository.mjs robust aktualisiert."
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: Unit-Tests ausführen
        run: npm run test:unit

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find assets scripts tests \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -print0
          )

      - name: Browser-Tests ausführen
        run: npm run test:e2e

      - name: Temporären Installer aufräumen
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            scripts/applyManifestRendererHardening.mjs

      - name: Diff prüfen
        run: git diff --check

      - name: Änderungen gesammelt committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets \
            scripts \
            tests \
            package.json

          if git diff --cached --quiet; then
            echo "Keine pushbaren Paket-1-Änderungen vorhanden."
            exit 0
          fi

          echo "Gestagte Dateien:"
          git diff --cached --name-status

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "FEHLER: Workflow-Datei wurde versehentlich gestagt."
            exit 1
          fi

          git commit -m "Harden manifest renderer contract"
          git push
