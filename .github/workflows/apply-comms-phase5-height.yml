name: Apply Comms Phase 5 Height Limit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-height-limit:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Höhenbegrenzung anwenden
        run: node scripts/applyCommsPhase5Height.mjs

      - name: JavaScript-Syntax prüfen
        run: |
          node --check scripts/applyCommsPhase5Height.mjs
          node --check assets/js/views/commsMapView.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/js/views/commsMapView.js assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Limit comms map height to viewport"
            git push
          fi
