name: Merge Navigation Banners

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-design:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Navigationsbanner zusammenführen
        run: node scripts/applyMergedNavigationBanner.mjs

      - name: JavaScript-Syntax prüfen
        run: node --check assets/js/views/pageBreadcrumbView.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             assets/js/views/pageBreadcrumbView.js             assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Merge toolbar and breadcrumb banner"
            git push
          fi
