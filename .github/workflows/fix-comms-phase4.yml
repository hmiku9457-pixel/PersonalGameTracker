name: Fix Division 2 Comms Phase 4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-comms-map-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase-4-Hotfix anwenden
        run: node scripts/fixCommsPhase4.mjs

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/views/commsMapController.js
          node --check assets/js/views/commsMapView.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/js/views/commsMapController.js \
            assets/js/views/commsMapView.js \
            assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Fix Division 2 comms map controls"
            git push
          fi
