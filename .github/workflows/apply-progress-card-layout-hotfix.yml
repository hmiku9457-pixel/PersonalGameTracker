name: Apply native overview card layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply-Skript prüfen
        run: node --check scripts/applyProgressCardLayoutHotfix.mjs

      - name: Native Übersichtskarten anwenden
        run: node scripts/applyProgressCardLayoutHotfix.mjs

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/views/overviewCardView.js
          node --check assets/js/views/gameView.js
          node --check assets/js/views/commsOverviewView.js

      - name: Observer-Hotfix als entfernt prüfen
        run: |
          test ! -f assets/js/progressCardLayoutHotfix.js
          ! grep -R "progressCardLayoutHotfix.js" index.html 404.html
          ! grep -R "new MutationObserver" assets/js/views/overviewCardView.js

      - name: Repository-Daten prüfen
        run: |
          if [ -f scripts/validateRepository.mjs ]; then
            node scripts/validateRepository.mjs
          fi

      - name: Browser-Smoke-Tests vorbereiten
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npx playwright install --with-deps chromium
          fi

      - name: Browser-Smoke-Tests ausführen
        run: |
          if [ -f package-lock.json ]; then
            npm run test:e2e
          else
            echo "Kein package-lock.json vorhanden; Browser-Tests übersprungen."
          fi

      - name: Einmaliges Apply-Skript entfernen
        run: rm -f scripts/applyProgressCardLayoutHotfix.mjs

      - name: Änderungen prüfen
        run: git diff --check

      - name: Änderungen committen und pushen
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render overview cards natively with one shared style"
          git push
