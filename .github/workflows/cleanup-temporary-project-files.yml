name: Clean Temporary Project Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bestand vor dem Aufräumen anzeigen
        shell: bash
        run: |
          echo "Temporäre Skripte:"
          if [ -d scripts ]; then
            find scripts -type f -print | sort
          else
            echo "Kein scripts-Ordner vorhanden."
          fi

          echo
          echo "GitHub-Action-Workflows:"
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -print | sort
          else
            echo "Keine Workflows vorhanden."
          fi

      - name: Produktive Referenzen auf scripts prüfen
        shell: bash
        run: |
          references="$(
            git grep -n -I \
              -e 'scripts/' \
              -- \
              ':!scripts/**' \
              ':!.github/workflows/**' \
              ':!README.md' \
              2>/dev/null || true
          )"

          if [ -n "$references" ]; then
            echo "Außerhalb der temporären Ordner wurden Referenzen auf scripts/ gefunden:"
            echo "$references"
            echo
            echo "Das Aufräumen wurde vorsichtshalber abgebrochen."
            exit 1
          fi

          echo "Keine produktiven Referenzen auf scripts/ gefunden."

      - name: Temporäre Dateien entfernen
        shell: bash
        run: |
          rm -rf scripts

          # Alle vorhandenen Workflows wurden für die einmaligen
          # Migrationen, Phasen und Design-Patches angelegt.
          # Auch dieser Cleanup-Workflow entfernt sich selbst.
          if [ -d .github/workflows ]; then
            find .github/workflows -maxdepth 1 -type f -delete
          fi

          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Änderungen prüfen
        shell: bash
        run: |
          git status --short

          if [ -d scripts ]; then
            echo "Fehler: scripts wurde nicht vollständig entfernt."
            exit 1
          fi

          if [ -d .github/workflows ] &&
             find .github/workflows -maxdepth 1 -type f | grep -q .; then
            echo "Fehler: Es sind noch Workflow-Dateien vorhanden."
            exit 1
          fi

      - name: Aufräumen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine temporären Dateien mehr vorhanden."
          else
            git commit -m "Remove temporary migration and patch files"
            git push
          fi
