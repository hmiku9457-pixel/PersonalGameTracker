name: Apply Comms Breadcrumb Banner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-design:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Navigationsbanner anwenden
        run: node scripts/applyCommsBreadcrumbBanner.mjs

      - name: JavaScript prüfen
        run: node --check assets/js/views/categoryView.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/js/views/categoryView.js assets/css/tracker.css

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Add breadcrumb titles to Comms banners"
            git push
          fi
