name: Apply Division 2 Comms Phase 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-phase-2:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase 2 anwenden
        run: node scripts/applyCommsPhase2.mjs

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/router.js
          node --check assets/js/views/categoryView.js
          node --check assets/js/views/commsOverviewView.js

      - name: Änderungen anzeigen
        run: git status --short

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/js/router.js \
            assets/js/views/categoryView.js \
            assets/js/views/commsOverviewView.js \
            assets/css/tracker.css \
            data/theDivision2/collectibles/manifest.json \
            data/theDivision2/collectibles/commsV2

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Add Division 2 Comms phase 2 navigation"
            git push
          fi
