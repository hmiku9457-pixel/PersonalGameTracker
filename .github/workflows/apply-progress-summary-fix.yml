name: Apply progress summary fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply-Skript prüfen
        run: node --check scripts/applyProgressSummaryFix.mjs

      - name: Fix anwenden
        run: node scripts/applyProgressSummaryFix.mjs

      - name: Fortschrittsindizes erzeugen
        run: npm run generate:progress-index

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Fortschrittsindizes prüfen
        run: npm run check:progress-index

      - name: Repository validieren
        run: npm run validate:data

      - name: Browser-Smoke-Tests ausführen
        run: npm run test:e2e

      - name: Temporäre Paketdateien entfernen
        run: |
          rm -rf update
          rm -f scripts/applyProgressSummaryFix.mjs

      - name: Geänderte Dateien prüfen
        run: git diff --check

      - name: Änderungen committen und pushen
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix progress summaries with item ID indexes"
          git push
