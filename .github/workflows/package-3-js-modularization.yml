name: Package 3 - JS modularization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: JavaScript modularisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          CONTROLS_VIEW = Path("assets/js/views/categoryControlsView.js")
          CATEGORY_VIEW = Path("assets/js/views/categoryView.js")
          PROGRESS_SERVICE = Path("assets/js/services/progressService.js")
          ROUTER = Path("assets/js/router.js")

          CONTROLS_ENGINE = Path("assets/js/views/categoryControlsEngine.js")
          CATEGORY_PROGRESS_VIEW = Path("assets/js/views/categoryProgressView.js")
          PROGRESS_CALCULATION_SERVICE = Path(
              "assets/js/services/progressCalculationService.js"
          )
          ROUTE_HASH_SERVICE = Path("assets/js/services/routeHashService.js")


          def read(path):
              return path.read_text(
                  encoding="utf-8"
              ).replace(
                  "\r\n",
                  "\n"
              )


          def write(path, content):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  content.rstrip() + "\n",
                  encoding="utf-8"
              )

              print(
                  f"[WRITE] {path}"
              )


          def replace_once(
              source,
              old,
              new,
              label
          ):
              count = source.count(
                  old
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: erwartete genau eine Fundstelle, "
                      f"gefunden: {count}"
                  )

              return source.replace(
                  old,
                  new,
                  1
              )


          def remove_between(
              source,
              start_marker,
              end_marker,
              label
          ):
              start = source.find(
                  start_marker
              )

              end = source.find(
                  end_marker,
                  start + 1
              )

              if (
                  start < 0
                  or end < 0
                  or end <= start
              ):
                  raise SystemExit(
                      f"{label}: Abschnitt konnte nicht "
                      "eindeutig abgegrenzt werden."
                  )

              return (
                  source[:start]
                  + source[end:]
              )


          controls_engine = r'''/* =========================================================
             Personal Game Tracker
             Category Controls Engine
             ========================================================= */

          import {
              getCurrentLocale
          } from "../services/languageService.js";


          const categoryElementCache =
              new WeakMap();

          const scheduledCategoryUpdateFrames =
              new WeakMap();

          const categoryStateChangeHandlers =
              new WeakMap();


          export function resetCategoryControlsEngine(
              container
          ) {
              const pendingUpdateFrame =
                  scheduledCategoryUpdateFrames.get(
                      container
                  );

              if (
                  pendingUpdateFrame !==
                  undefined
              ) {
                  cancelAnimationFrame(
                      pendingUpdateFrame
                  );
              }

              scheduledCategoryUpdateFrames.delete(
                  container
              );

              categoryElementCache.delete(
                  container
              );

              const previousHandler =
                  categoryStateChangeHandlers.get(
                      container
                  );

              if (previousHandler) {
                  container.removeEventListener(
                      "tracker-item-state-changed",
                      previousHandler
                  );

                  categoryStateChangeHandlers.delete(
                      container
                  );
              }
          }


          export function setCategoryStateChangeHandler(
              container,
              handler
          ) {
              const previousHandler =
                  categoryStateChangeHandlers.get(
                      container
                  );

              if (previousHandler) {
                  container.removeEventListener(
                      "tracker-item-state-changed",
                      previousHandler
                  );
              }

              container.addEventListener(
                  "tracker-item-state-changed",
                  handler
              );

              categoryStateChangeHandlers.set(
                  container,
                  handler
              );
          }


          export function scheduleCategoryControlsUpdate(
              container,
              state,
              resultCount,
              emptyMessage,
              formatResultCount
          ) {
              const previousFrame =
                  scheduledCategoryUpdateFrames.get(
                      container
                  );

              if (
                  previousFrame !==
                  undefined
              ) {
                  cancelAnimationFrame(
                      previousFrame
                  );
              }

              const frame =
                  requestAnimationFrame(
                      () => {
                          scheduledCategoryUpdateFrames.delete(
                              container
                          );

                          if (
                              !container.isConnected
                          ) {
                              return;
                          }

                          applyCategoryControls(
                              container,
                              state,
                              resultCount,
                              emptyMessage,
                              formatResultCount
                          );
                      }
                  );

              scheduledCategoryUpdateFrames.set(
                  container,
                  frame
              );
          }


          export function applyCategoryControls(
              container,
              state,
              resultCount,
              emptyMessage,
              formatResultCount
          ) {
              const pendingFrame =
                  scheduledCategoryUpdateFrames.get(
                      container
                  );

              if (
                  pendingFrame !==
                  undefined
              ) {
                  cancelAnimationFrame(
                      pendingFrame
                  );

                  scheduledCategoryUpdateFrames.delete(
                      container
                  );
              }

              const categoryElements =
                  getCategoryElements(
                      container
                  );

              const query =
                  normalizeSearchText(
                      state.query
                  );

              const searchTerms =
                  query
                      .split(/\s+/)
                      .filter(Boolean);

              const searchIsActive =
                  searchTerms.length > 0;

              const statusIsActive =
                  state.status !==
                      "all";

              const groups =
                  categoryElements.groups;

              if (
                  searchIsActive &&
                  !state.searchActive
              ) {
                  state.searchActive =
                      true;

                  state.groupOpenState.clear();

                  for (
                      const group
                      of groups
                  ) {
                      state.groupOpenState.set(
                          group,
                          group.open
                      );
                  }
              }

              if (
                  !searchIsActive &&
                  state.searchActive
              ) {
                  for (
                      const group
                      of groups
                  ) {
                      if (
                          state.groupOpenState.has(
                              group
                          )
                      ) {
                          group.open =
                              state.groupOpenState.get(
                                  group
                              );
                      }
                  }

                  state.groupOpenState.clear();

                  state.searchActive =
                      false;
              }

              if (state.sortDirty) {
                  sortCategoryItems(
                      categoryElements,
                      state.sort
                  );

                  state.sortDirty =
                      false;
              }

              let visibleItemCount =
                  0;

              for (
                  const item
                  of categoryElements.items
              ) {
                  const searchText =
                      getItemSearchText(
                          item
                      );

                  const matchesSearch =
                      searchTerms.every(
                          term =>
                              searchText.includes(
                                  term
                              )
                      );

                  const matchesStatus =
                      matchesStatusFilter(
                          item,
                          state.status
                      );

                  const visible =
                      matchesSearch &&
                      matchesStatus;

                  item.hidden =
                      !visible;

                  if (visible) {
                      visibleItemCount++;
                  }
              }

              for (
                  const list
                  of categoryElements.lists
              ) {
                  const listEntries =
                      categoryElements.listItems.get(
                          list
                      ) ?? [];

                  list.hidden =
                      !listEntries.some(
                          item =>
                              !item.hidden
                      );
              }

              for (
                  const group
                  of groups
              ) {
                  const groupEntries =
                      categoryElements.groupItems.get(
                          group
                      ) ?? [];

                  const hasVisibleItem =
                      groupEntries.some(
                          item =>
                              !item.hidden
                      );

                  group.hidden =
                      !hasVisibleItem;

                  if (
                      searchIsActive &&
                      hasVisibleItem
                  ) {
                      group.open =
                          true;
                  }
              }

              if (searchIsActive) {
                  resultCount.textContent =
                      formatResultCount(
                          visibleItemCount,
                          true
                      );

                  resultCount.hidden =
                      false;
              }
              else if (statusIsActive) {
                  resultCount.textContent =
                      formatResultCount(
                          visibleItemCount,
                          false
                      );

                  resultCount.hidden =
                      false;
              }
              else {
                  resultCount.textContent =
                      "";

                  resultCount.hidden =
                      true;
              }

              const filteringIsActive =
                  searchIsActive ||
                  statusIsActive;

              emptyMessage.hidden =
                  !(
                      filteringIsActive &&
                      visibleItemCount === 0
                  );
          }


          function normalizeSearchText(
              value
          ) {
              return String(
                  value ?? ""
              )
                  .normalize(
                      "NFD"
                  )
                  .replace(
                      /[\u0300-\u036f]/g,
                      ""
                  )
                  .replace(
                      /ß/g,
                      "ss"
                  )
                  .toLowerCase()
                  .trim();
          }


          function getItemSearchText(
              itemElement
          ) {
              if (
                  itemElement.dataset.searchText
              ) {
                  return itemElement.dataset
                      .searchText;
              }

              const values = [];

              if (
                  itemElement.dataset.itemId
              ) {
                  values.push(
                      itemElement.dataset.itemId
                  );
              }

              const name =
                  itemElement.querySelector(
                      ".tracker-item-name"
                  );

              if (name?.textContent) {
                  values.push(
                      name.textContent
                  );
              }

              const description =
                  itemElement.querySelector(
                      ".tracker-item-description"
                  );

              if (
                  description?.textContent
              ) {
                  values.push(
                      description.textContent
                  );
              }

              const detailElements =
                  itemElement.querySelectorAll(
                      [
                          ".tracker-item-details dt",
                          ".tracker-item-details dd"
                      ].join(", ")
                  );

              for (
                  const detailElement
                  of detailElements
              ) {
                  if (
                      detailElement.textContent
                  ) {
                      values.push(
                          detailElement.textContent
                      );
                  }
              }

              const searchText =
                  normalizeSearchText(
                      values.join(" ")
                  );

              itemElement.dataset.searchText =
                  searchText;

              return searchText;
          }


          function getItemSortName(
              itemElement
          ) {
              if (
                  itemElement.dataset.sortName
              ) {
                  return itemElement.dataset
                      .sortName;
              }

              const name =
                  itemElement.querySelector(
                      ".tracker-item-name"
                  );

              const sortName =
                  String(
                      name?.textContent ??
                      itemElement.dataset.itemId ??
                      ""
                  )
                      .trim();

              itemElement.dataset.sortName =
                  sortName;

              return sortName;
          }


          function matchesStatusFilter(
              item,
              status
          ) {
              if (
                  status === "all"
              ) {
                  return true;
              }

              const completed =
                  item.classList.contains(
                      "is-completed"
                  );

              if (
                  status === "completed"
              ) {
                  return completed;
              }

              if (
                  status === "incomplete"
              ) {
                  return !completed;
              }

              return true;
          }


          function getCategoryElements(
              container
          ) {
              const cached =
                  categoryElementCache.get(
                      container
                  );

              if (cached) {
                  return cached;
              }

              const items =
                  Array.from(
                      container.querySelectorAll(
                          ".tracker-item"
                      )
                  );

              const lists =
                  Array.from(
                      container.querySelectorAll(
                          ".tracker-list"
                      )
                  );

              const groups =
                  Array.from(
                      container.querySelectorAll(
                          ".category-group"
                      )
                  );

              const listItems =
                  new Map();

              for (
                  const list
                  of lists
              ) {
                  listItems.set(
                      list,
                      Array.from(
                          list.querySelectorAll(
                              ":scope > .tracker-item"
                          )
                      )
                  );
              }

              const groupItems =
                  new Map();

              for (
                  const group
                  of groups
              ) {
                  groupItems.set(
                      group,
                      Array.from(
                          group.querySelectorAll(
                              ".tracker-item"
                          )
                      )
                  );
              }

              const result = {
                  items,
                  lists,
                  groups,
                  listItems,
                  groupItems
              };

              categoryElementCache.set(
                  container,
                  result
              );

              return result;
          }


          function sortCategoryItems(
              categoryElements,
              direction
          ) {
              const locale =
                  getCurrentLocale();

              for (
                  const list
                  of categoryElements.lists
              ) {
                  const items =
                      categoryElements.listItems.get(
                          list
                      ) ?? [];

                  items.sort(
                      (first, second) => {
                          const firstName =
                              getItemSortName(
                                  first
                              );

                          const secondName =
                              getItemSortName(
                                  second
                              );

                          const comparison =
                              firstName.localeCompare(
                                  secondName,
                                  locale,
                                  {
                                      sensitivity:
                                          "base",

                                      numeric:
                                          true
                                  }
                              );

                          return direction ===
                              "desc"
                              ? -comparison
                              : comparison;
                      }
                  );

                  list.append(
                      ...items
                  );
              }
          }
          '''

          progress_calculation_service = r'''/* =========================================================
             Personal Game Tracker
             Progress Calculation Service
             ========================================================= */

          export function getCompletedCountForCategory(
              progressData,
              categoryId
          ) {
              if (
                  typeof categoryId !== "string" ||
                  !progressData?.completedByCategory
              ) {
                  return 0;
              }

              const value =
                  Number(
                      progressData.completedByCategory[
                          categoryId
                      ]
                  );

              return Number.isInteger(value) &&
                  value > 0
                      ? value
                      : 0;
          }


          export function getExternalItemStatus(
              item,
              progressData
          ) {
              if (
                  !item?.id ||
                  !progressData?.progress
              ) {
                  return null;
              }

              if (
                  !Object.prototype.hasOwnProperty.call(
                      progressData.progress,
                      item.id
                  )
              ) {
                  return null;
              }

              const value =
                  progressData.progress[
                      item.id
                  ];

              if (
                  typeof value === "boolean"
              ) {
                  return value;
              }

              if (
                  value &&
                  typeof value === "object"
              ) {
                  return Boolean(
                      value.found ||
                      value.completed ||
                      value.collected ||
                      value.unlocked
                  );
              }

              return Boolean(
                  value
              );
          }


          export function isItemCompleted(
              item,
              progressData = null
          ) {
              const externalStatus =
                  getExternalItemStatus(
                      item,
                      progressData
                  );

              if (
                  externalStatus !== null
              ) {
                  return externalStatus;
              }

              return Boolean(
                  item?.found ||
                  item?.completed ||
                  item?.collected ||
                  item?.unlocked
              );
          }


          export function calculateItemsProgress(
              items,
              progressData = null
          ) {
              if (!Array.isArray(items)) {
                  return {
                      completed: 0,
                      total: 0
                  };
              }

              let completed =
                  0;

              for (const item of items) {
                  if (
                      isItemCompleted(
                          item,
                          progressData
                      )
                  ) {
                      completed++;
                  }
              }

              return {
                  completed,
                  total:
                      items.length
              };
          }


          export function calculateGroupedProgress(
              groups,
              progressData = null
          ) {
              if (!Array.isArray(groups)) {
                  return {
                      completed: 0,
                      total: 0
                  };
              }

              let completed =
                  0;

              let total =
                  0;

              for (const group of groups) {
                  const result =
                      calculateItemsProgress(
                          group?.items ?? [],
                          progressData
                      );

                  completed +=
                      result.completed;

                  total +=
                      result.total;
              }

              return {
                  completed,
                  total
              };
          }


          export function calculateCategoryProgress(
              data,
              progressData = null
          ) {
              if (!data) {
                  return {
                      completed: 0,
                      total: 0
                  };
              }

              if (Array.isArray(data)) {
                  return calculateItemsProgress(
                      data,
                      progressData
                  );
              }

              if (
                  Array.isArray(
                      data.items
                  )
              ) {
                  return calculateItemsProgress(
                      data.items,
                      progressData
                  );
              }

              if (
                  Array.isArray(
                      data.groups
                  )
              ) {
                  return calculateGroupedProgress(
                      data.groups,
                      progressData
                  );
              }

              if (
                  Array.isArray(
                      data.sections
                  )
              ) {
                  let completed =
                      0;

                  let total =
                      0;

                  for (
                      const section
                      of data.sections
                  ) {
                      const result =
                          calculateCategoryProgress(
                              section,
                              progressData
                          );

                      completed +=
                          result.completed;

                      total +=
                          result.total;
                  }

                  return {
                      completed,
                      total
                  };
              }

              return {
                  completed: 0,
                  total: 0
              };
          }
          '''

          route_hash_service = r'''/* =========================================================
             Personal Game Tracker
             Route Hash Service
             ========================================================= */

          export function getRouteParts() {
              const hash =
                  window.location.hash
                      .replace(/^#/, "");

              if (!hash) {
                  return [];
              }

              return hash
                  .split("/")
                  .filter(Boolean)
                  .map(part => {
                      try {
                          return decodeURIComponent(
                              part
                          );
                      }
                      catch {
                          return part;
                      }
                  });
          }


          export function buildGameHash(
              gameId,
              routeIds = []
          ) {
              const parts = [
                  "game",

                  encodeURIComponent(
                      gameId
                  ),

                  ...routeIds.map(
                      routeId =>
                          encodeURIComponent(
                              routeId
                          )
                  )
              ];

              return `#${parts.join("/")}`;
          }
          '''

          category_progress_view = r'''/* =========================================================
             Personal Game Tracker
             Category Progress View
             ========================================================= */

          import {
              calculateCategoryProgress
          } from "../services/progressCalculationService.js";


          export function updateCategoryGroupProgress(
              groupElement
          ) {
              if (!groupElement) {
                  return;
              }

              const progressElement =
                  groupElement.querySelector(
                      ".category-group-progress"
                  );

              if (!progressElement) {
                  return;
              }

              const items =
                  groupElement.querySelectorAll(
                      ".tracker-item"
                  );

              const completedItems =
                  groupElement.querySelectorAll(
                      ".tracker-item.is-completed"
                  );

              progressElement.textContent =
                  `${completedItems.length} / ${items.length}`;
          }


          export function updateAllCategoryGroupProgress(
              container
          ) {
              if (!container) {
                  return;
              }

              const groups =
                  container.querySelectorAll(
                      ".category-group"
                  );

              for (
                  const group of groups
              ) {
                  updateCategoryGroupProgress(
                      group
                  );
              }
          }


          export function updateCurrentCategoryProgress(
              categoryData,
              progressData
          ) {
              const element =
                  document.querySelector(
                      "[data-current-category-progress]"
                  );

              if (!element) {
                  return;
              }

              const progress =
                  calculateCategoryProgress(
                      categoryData,
                      progressData
                  );

              const percent =
                  progress.total > 0
                      ? Math.round(
                          (
                              progress.completed /
                              progress.total
                          ) * 100
                      )
                      : 0;

              element.textContent =
                  `${progress.completed} / ${progress.total} · ${percent} %`;
          }
          '''

          write(
              CONTROLS_ENGINE,
              controls_engine
          )

          write(
              PROGRESS_CALCULATION_SERVICE,
              progress_calculation_service
          )

          write(
              ROUTE_HASH_SERVICE,
              route_hash_service
          )

          write(
              CATEGORY_PROGRESS_VIEW,
              category_progress_view
          )


          controls = read(
              CONTROLS_VIEW
          )

          if (
              "./categoryControlsEngine.js"
              not in controls
          ):
              controls = replace_once(
                  controls,
                  '''import {
          \tgetCurrentLanguage,
          \tgetCurrentLocale
          } from "../services/languageService.js";
          ''',
                  '''import {
          \tgetCurrentLanguage
          } from "../services/languageService.js";


          import {
          \tapplyCategoryControls,
          \tresetCategoryControlsEngine,
          \tscheduleCategoryControlsUpdate,
          \tsetCategoryStateChangeHandler
          } from "./categoryControlsEngine.js";
          ''',
                  "categoryControlsView: Imports"
              )


          performance_marker = '''/* ---------------------------------------------------------
             2. Performance-Zustand
             --------------------------------------------------------- */
          '''

          controls_marker = '''/* ---------------------------------------------------------
             3. Kategorie-Controls
             --------------------------------------------------------- */
          '''

          if performance_marker in controls:
              controls = remove_between(
                  controls,
                  performance_marker,
                  controls_marker,
                  "categoryControlsView: Performance-Zustand"
              )


          reset_start = '''\tconst pendingUpdateFrame =
          \t\tscheduledCategoryUpdateFrames.get(
          \t\t\tcontainer
          \t\t);
          '''

          reset_end = '''\t/*
          \t * Doppelte Bedienelemente verhindern.
          \t */
          '''

          if reset_start in controls:
              start = controls.find(
                  reset_start
              )

              end = controls.find(
                  reset_end,
                  start + 1
              )

              if end < 0:
                  raise SystemExit(
                      "categoryControlsView: Reset-Ende fehlt."
                  )

              controls = (
                  controls[:start]
                  + '''\tresetCategoryControlsEngine(
          \t\tcontainer
          \t);


          '''
                  + controls[end:]
              )


          for old, new in [
              (
                  '''\t\t\tscheduleCategoryControlsUpdate(
          \t\t\t\tcontainer,
          \t\t\t\tcontrolState,
          \t\t\t\tresultCount,
          \t\t\t\temptyMessage
          \t\t\t);''',
                  '''\t\t\tscheduleCategoryControlsUpdate(
          \t\t\t\tcontainer,
          \t\t\t\tcontrolState,
          \t\t\t\tresultCount,
          \t\t\t\temptyMessage,
          \t\t\t\tgetResultCountText
          \t\t\t);'''
              ),
              (
                  '''\t\t\tapplyCategoryControls(
          \t\t\t\tcontainer,
          \t\t\t\tcontrolState,
          \t\t\t\tresultCount,
          \t\t\t\temptyMessage
          \t\t\t);''',
                  '''\t\t\tapplyCategoryControls(
          \t\t\t\tcontainer,
          \t\t\t\tcontrolState,
          \t\t\t\tresultCount,
          \t\t\t\temptyMessage,
          \t\t\t\tgetResultCountText
          \t\t\t);'''
              ),
              (
                  '''\t\tapplyCategoryControls(
          \t\t\tcontainer,
          \t\t\tcontrolState,
          \t\t\tresultCount,
          \t\t\temptyMessage
          \t\t);''',
                  '''\t\tapplyCategoryControls(
          \t\t\tcontainer,
          \t\t\tcontrolState,
          \t\t\tresultCount,
          \t\t\temptyMessage,
          \t\t\tgetResultCountText
          \t\t);'''
              ),
              (
                  '''\tapplyCategoryControls(
          \t\tcontainer,
          \t\tcontrolState,
          \t\tresultCount,
          \t\temptyMessage
          \t);''',
                  '''\tapplyCategoryControls(
          \t\tcontainer,
          \t\tcontrolState,
          \t\tresultCount,
          \t\temptyMessage,
          \t\tgetResultCountText
          \t);'''
              )
          ]:
              controls = controls.replace(
                  old,
                  new
              )


          old_handler_registration = '''\tcontainer.addEventListener(
          \t\t"tracker-item-state-changed",
          \t\tstateChangeHandler
          \t);

          \tcategoryStateChangeHandlers.set(
          \t\tcontainer,
          \t\tstateChangeHandler
          \t);
          '''

          if old_handler_registration in controls:
              controls = replace_once(
                  controls,
                  old_handler_registration,
                  '''\tsetCategoryStateChangeHandler(
          \t\tcontainer,
          \t\tstateChangeHandler
          \t);
          ''',
                  "categoryControlsView: State-Handler"
              )


          text_normalization_marker = '''/* ---------------------------------------------------------
             5. Textnormalisierung
             --------------------------------------------------------- */
          '''

          result_text_marker = '''/* ---------------------------------------------------------
             12. Treffertext
             --------------------------------------------------------- */
          '''

          if text_normalization_marker in controls:
              controls = remove_between(
                  controls,
                  text_normalization_marker,
                  result_text_marker,
                  "categoryControlsView: Engine-Funktionen"
              )


          controls = controls.replace(
              '''/* ---------------------------------------------------------
             12. Treffertext
             --------------------------------------------------------- */''',
              '''/* ---------------------------------------------------------
             5. Treffertext
             --------------------------------------------------------- */''',
              1
          )

          for stale_token in [
              "categoryElementCache",
              "scheduledCategoryUpdateFrames",
              "categoryStateChangeHandlers",
              "function normalizeSearchText(",
              "function getCategoryElements(",
              "function sortCategoryItems("
          ]:
              if stale_token in controls:
                  raise SystemExit(
                      "categoryControlsView enthält nach Auslagerung "
                      f"weiterhin Altlogik: {stale_token}"
                  )

          write(
              CONTROLS_VIEW,
              controls
          )


          progress = read(
              PROGRESS_SERVICE
          )

          calculation_import = '''import {
          \tcalculateCategoryProgress,
          \tcalculateGroupedProgress,
          \tcalculateItemsProgress,
          \tgetCompletedCountForCategory,
          \tgetExternalItemStatus,
          \tisItemCompleted
          } from "./progressCalculationService.js";

          export {
          \tcalculateCategoryProgress,
          \tcalculateGroupedProgress,
          \tcalculateItemsProgress,
          \tgetCompletedCountForCategory,
          \tgetExternalItemStatus,
          \tisItemCompleted
          };


          '''

          if (
              "./progressCalculationService.js"
              not in progress
          ):
              language_import = '''import {
          \tgetCurrentLanguage
          } from "./languageService.js";


          '''

              progress = replace_once(
                  progress,
                  language_import,
                  language_import
                  + calculation_import,
                  "progressService: Calculation-Import"
              )


          completed_count_doc = '''/**
           * Gibt die Anzahl erledigter Items einer Kategorie zurück.
          '''

          item_status_marker = '''/* ---------------------------------------------------------
             6. Item-Status
             --------------------------------------------------------- */
          '''

          if completed_count_doc in progress:
              progress = remove_between(
                  progress,
                  completed_count_doc,
                  item_status_marker,
                  "progressService: Kategorieindex-Helfer"
              )


          save_marker = '''/* ---------------------------------------------------------
             8. Fortschritt speichern
             --------------------------------------------------------- */
          '''

          if item_status_marker in progress:
              progress = remove_between(
                  progress,
                  item_status_marker,
                  save_marker,
                  "progressService: Berechnungslogik"
              )

          write(
              PROGRESS_SERVICE,
              progress
          )


          category = read(
              CATEGORY_VIEW
          )

          category = category.replace(
              '''\tcalculateCategoryProgress,
          \tisItemCompleted,''',
              '''\tisItemCompleted,''',
              1
          )

          if (
              "./categoryProgressView.js"
              not in category
          ):
              controls_import = '''import {
          \trenderCategoryControls
          } from "./categoryControlsView.js";
          '''

              category = replace_once(
                  category,
                  controls_import,
                  controls_import
                  + '''

          import {
          \tupdateAllCategoryGroupProgress,
          \tupdateCategoryGroupProgress,
          \tupdateCurrentCategoryProgress
          } from "./categoryProgressView.js";
          ''',
                  "categoryView: Progress-View-Import"
              )


          group_progress_marker = '''/* ---------------------------------------------------------
             11. Gruppenfortschritt
             --------------------------------------------------------- */
          '''

          item_search_marker = '''/* ---------------------------------------------------------
             13. Item-Suche
             --------------------------------------------------------- */
          '''

          if group_progress_marker in category:
              category = remove_between(
                  category,
                  group_progress_marker,
                  item_search_marker,
                  "categoryView: Fortschrittsanzeige"
              )


          category = category.replace(
              '''/* ---------------------------------------------------------
             13. Item-Suche
             --------------------------------------------------------- */''',
              '''/* ---------------------------------------------------------
             11. Item-Suche
             --------------------------------------------------------- */''',
              1
          )

          category = category.replace(
              '''/* ---------------------------------------------------------
             14. Fortschrittsbuttons
             --------------------------------------------------------- */''',
              '''/* ---------------------------------------------------------
             12. Fortschrittsbuttons
             --------------------------------------------------------- */''',
              1
          )

          write(
              CATEGORY_VIEW,
              category
          )


          router = read(
              ROUTER
          )

          if (
              "./services/routeHashService.js"
              not in router
          ):
              view_scope_import = '''import {
          \tbeginViewScope,
          \tcompleteViewRender,
          \tisViewScopeCurrent
          } from "./services/viewScopeService.js";
          '''

              router = replace_once(
                  router,
                  view_scope_import,
                  view_scope_import
                  + '''

          import {
          \tbuildGameHash,
          \tgetRouteParts
          } from "./services/routeHashService.js";
          ''',
                  "router: RouteHash-Import"
              )


          router = router.replace(
              '''\tconst viewScope =
          \t\tbeginViewScope();

          const routeParts =
          \t\tgetRouteParts();''',
              '''\tconst viewScope =
          \t\tbeginViewScope();

          \tconst routeParts =
          \t\tgetRouteParts();''',
              1
          )

          router = router.replace(
              '''\t\tif (error?.name === "AbortError") {
          \t\t\treturn;
          \t\t}


          ''',
              "",
              1
          )


          hash_section_marker = '''/* ---------------------------------------------------------
             6. Hash auslesen
             --------------------------------------------------------- */
          '''

          if hash_section_marker in router:
              router = (
                  router[
                      :router.find(
                          hash_section_marker
                      )
                  ].rstrip()
                  + "\n"
              )

          write(
              ROUTER,
              router
          )


          print(
              "Paket 3 angewendet: JS-Verantwortlichkeiten modularisiert."
          )
          PY

