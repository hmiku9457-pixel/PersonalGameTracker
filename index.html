<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="assets/css/main.css">

		<title>Personal Game Tracker</title>
	</head>

	<body>
		<!-- Seitenkopf -->
		<header>
			<h1>Personal Game Tracker</h1>
		
			<div class="account-module">
		
				<!-- Nicht eingeloggt -->
				<div id="account-logged-out">
					<button type="button" id="login-button">
						Anmelden
					</button>
				</div>
		
				<!-- Eingeloggt -->
				<div id="account-logged-in" hidden>
					<span id="account-username">
						Benutzer
					</span>
		
					<button type="button" id="account-button">
						Account
					</button>
		
					<button type="button" id="logout-button">
						Abmelden
					</button>
				</div>
		
			</div>
		</header>

		<!-- Hauptlayout -->
		<div class="page-layout">

			<!-- Spiele-Navigation -->
			<aside class="sidebar">
				<nav aria-label="Spiele">
					<h2>Spiele</h2>

					<ul>
						<li>
							<a href="games/theDivision2/" data-page="games/theDivision2/index.html">
								The Division 2
							</a>
						</li>
						<li>
							<a href="games/cyberpunk2077/" data-page="games/cyberpunk2077/index.html">
								Cyberpunk 2077
							</a>
						</li>
					</ul>
					<ul id="game-navigation">
						<!-- Wird dynamisch geladen -->
					</ul>
				</nav>
			</aside>

			<!-- Dynamischer Seiteninhalt -->
			<main id="main-content">
				<section class="game-page">
					<div class="game-header">
						<h2 id="game-title">
							Spiel auswählen
						</h2>
					</div>

					<div
						id="category-grid"
						class="category-grid"
					>
						<!-- Kategorie-Buttons -->
					</div>

					<div
						id="game-progress"
						class="game-progress"
						hidden
					>
						<div class="game-progress-header">
							<span>Gesamtfortschritt</span>
							<strong id="game-progress-count">
								0 / 0
							</strong>
						</div>

						<div class="progress-bar">
							<div
								id="game-progress-fill"
								class="progress-bar-fill"
							></div>
						</div>

						<span id="game-progress-percent">
							0 %
						</span>
					</div>
				</section>
			</main>
		</div>
		
		<footer>
			<p>&copy; 2026 Personal Game Tracker</p>
		</footer>
		
		<script src="assets/js/main.js"></script>
	</body>

</html>
