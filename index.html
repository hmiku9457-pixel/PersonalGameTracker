<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="assets/css/tracker.css">

		<title>Personal Game Tracker</title>

    <link rel="stylesheet" href="assets/css/overview-cards.css">
</head>

	<body>

		<!-- Seitenkopf -->
		<header class="site-header">

			<!-- Sprachauswahl -->
			<div class="language-module">
				<label
					for="language-select"
					class="language-label"
				>
					Sprache
				</label>

				<select
					id="language-select"
					class="language-select"
					aria-label="Sprache auswählen"
				>
					<option value="de">
						Deutsch
					</option>

					<option value="en">
						English
					</option>
				</select>
			</div>

			<!-- Seitentitel -->
			<h1>
				Personal Game Tracker
			</h1>

			<!-- Account -->
			<div class="account-module">

				<!-- Nicht eingeloggt -->
				<div id="account-logged-out">
					<button
						type="button"
						id="login-button"
					>
						Anmelden
					</button>
				</div>

				<!-- Eingeloggt -->
				<div
					id="account-logged-in"
					hidden
				>
					<span id="account-username">
						Benutzer
					</span>

					<button
						type="button"
						id="logout-button"
					>
						Abmelden
					</button>
				</div>

			</div>

		</header>

		<!-- Authentifizierungsdialog -->
		<dialog
			id="auth-dialog"
			class="auth-dialog"
		>
			<div class="auth-dialog-content">

				<div class="auth-dialog-header">

					<h2 id="auth-dialog-title">
						Anmelden
					</h2>

					<button
						type="button"
						id="auth-close-button"
						class="auth-close-button"
						aria-label="Anmeldung schließen"
					>
						×
					</button>

				</div>

				<div
					class="auth-tabs"
				>

					<button
						type="button"
						class="auth-tab active"
						data-auth-mode="login"
					>
						Anmelden
					</button>

					<button
						type="button"
						class="auth-tab"
						data-auth-mode="register"
					>
						Registrieren
					</button>

				</div>

				<!-- Login -->
				<form id="login-form">

					<div class="auth-field">

						<label for="login-email">
							E-Mail-Adresse
						</label>

						<input
							type="email"
							id="login-email"
							name="email"
							autocomplete="username"
							required
						>

					</div>

					<div class="auth-field">

						<label for="login-password">
							Passwort
						</label>

						<input
							type="password"
							id="login-password"
							name="password"
							autocomplete="current-password"
							required
						>

					</div>

					<button
						type="submit"
						class="auth-submit-button"
					>
						Anmelden
					</button>

				</form>

				<!-- Registrierung -->
				<form
					id="register-form"
					hidden
				>

					<div class="auth-field">

						<label for="register-email">
							E-Mail-Adresse
						</label>

						<input
							type="email"
							id="register-email"
							name="email"
							autocomplete="email"
							required
						>

					</div>

					<div class="auth-field">

						<label for="register-password">
							Passwort
						</label>

						<input
							type="password"
							id="register-password"
							name="password"
							autocomplete="new-password"
							required
						>

					</div>

					<div class="auth-field">

						<label for="register-password-repeat">
							Passwort wiederholen
						</label>

						<input
							type="password"
							id="register-password-repeat"
							name="password-repeat"
							autocomplete="new-password"
							required
						>

					</div>

					<button
						type="submit"
						class="auth-submit-button"
					>
						Account erstellen
					</button>

				</form>

				<p
					id="auth-message"
					class="auth-message"
					role="status"
					aria-live="polite"
					hidden
				></p>

			</div>
		</dialog>

		<!-- Hauptlayout -->
		<div class="page-layout">

			<!-- Spiele-Navigation -->
			<aside class="sidebar">

				<nav aria-label="Spiele">

					<h2>
						<a
							id="games-overview-link"
							href="#games"
						>
							Spiele
						</a>
					</h2>

					<ul id="game-navigation"></ul>

				</nav>

			</aside>

			<!-- Dynamischer Seiteninhalt -->
			<main id="main-content" class="site-main">

				<h2>
					Willkommen
				</h2>

				<p>
					Wähle links ein Spiel aus.
				</p>

			</main>

		</div>

		<!-- Seitenfuß -->
		<footer class="site-footer">
			<p>
				&copy; 2026 Personal Game Tracker
			</p>
		</footer>

		<!-- Supabase SDK -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>

		<!-- Supabase -->
		<script src="./assets/js/supabase/supabaseClient.js"></script>
		<script src="./assets/js/supabase/authService.js"></script>

		<!-- Views -->
		<script
			type="module"
			src="./assets/js/views/authView.js"
		></script>

		<!-- Anwendung -->
		<script
			type="module"
			src="./assets/js/main.js"
		></script>

</body>
</html>
