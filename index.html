<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="assets/css/tracker.css">

		<title>Personal Game Tracker</title>
	</head>

	<body>
		<!-- Seitenkopf -->
		<header>
			<h1>Personal Game Tracker</h1>
		
			<div class="account-module">
		
				<!-- Nicht eingeloggt -->
				<div id="account-logged-out">
					<button type="button" id="login-button">
						Anmelden
					</button>
				</div>
		
				<!-- Eingeloggt -->
				<div id="account-logged-in" hidden>
					<span id="account-username">
						Benutzer
					</span>
		
					<button type="button" id="account-button">
						Account
					</button>
		
					<button type="button" id="logout-button">
						Abmelden
					</button>
				</div>
		
			</div>
		</header>

		<!-- Hauptlayout -->
		<div class="page-layout">

			<!-- Spiele-Navigation -->
			<aside class="sidebar">
				<nav aria-label="Spiele">
					<h2>Spiele</h2>

					<ul id="game-navigation">
						<!-- Wird dynamisch geladen -->
					</ul>
				</nav>
			</aside>

			<!-- Dynamischer Seiteninhalt -->
			<main id="main-content">
				<h2>Willkommen</h2>
				<p>Wähle links ein Spiel aus.</p>
			</main>
		</div>
		
		<footer>
			<p>&copy; 2026 Personal Game Tracker</p>
		</footer>
		
		<script src="assets/js/main.js"></script>
	</body>

</html>
