<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="assets/css/tracker.css">

		<title>Personal Game Tracker</title>
	</head>

	<body>
		<!-- Seitenkopf -->
		<header>
			<h1>Personal Game Tracker</h1>
		
			<div class="account-module">
		
				<!-- Nicht eingeloggt -->
				<div id="account-logged-out">
					<button type="button" id="login-button">
						Anmelden
					</button>
				</div>
		
				<!-- Eingeloggt -->
				<div id="account-logged-in" hidden>
					<span id="account-username">
						Benutzer
					</span>
		
					<button type="button" id="account-button" hidden>
						Account
					</button>
		
					<button type="button" id="logout-button">
						Abmelden
					</button>
				</div>
		
			</div>
		</header>
		
		<dialog
			id="auth-dialog"
			class="auth-dialog"
		>		
			<div class="auth-dialog-content">		
				<div class="auth-dialog-header">		
					<h2 id="auth-dialog-title">
						Anmelden
					</h2>
		
					<button
						type="button"
						id="auth-close-button"
						class="auth-close-button"
						aria-label="Anmeldung schließen"
					>
						×
					</button>		
				</div>		
		
				<div
					class="auth-tabs"
					role="tablist"
					aria-label="Benutzerkonto"
				>		
					<button
						type="button"
						class="auth-tab active"
						data-auth-mode="login"
					>
						Anmelden
					</button>		
					<button
						type="button"
						class="auth-tab"
						data-auth-mode="register"
					>
						Registrieren
					</button>		
				</div>		
		
				<!-- Login -->
				<form id="login-form">		
					<div class="auth-field">		
						<label for="login-email">
							E-Mail-Adresse
						</label>		
						<input
							type="email"
							id="login-email"
							name="email"
							autocomplete="username"
							required
						>		
					</div>		
		
					<div class="auth-field">		
						<label for="login-password">
							Passwort
						</label>		
						<input
							type="password"
							id="login-password"
							name="password"
							autocomplete="current-password"
							required
						>		
					</div>		
		
					<button
						type="submit"
						class="auth-submit-button"
					>
						Anmelden
					</button>		
				</form>		
		
				<!-- Registrierung -->
				<form
					id="register-form"
					hidden
				>		
					<div class="auth-field">		
						<label for="register-email">
							E-Mail-Adresse
						</label>		
						<input
							type="email"
							id="register-email"
							name="email"
							autocomplete="email"
							required
						>		
					</div>		
		
					<div class="auth-field">		
						<label for="register-password">
							Passwort
						</label>		
						<input
							type="password"
							id="register-password"
							name="password"
							autocomplete="new-password"
							required
						>		
					</div>		
		
					<div class="auth-field">		
						<label for="register-password-repeat">
							Passwort wiederholen
						</label>		
						<input
							type="password"
							id="register-password-repeat"
							name="password-repeat"
							autocomplete="new-password"
							required
						>		
					</div>		
		
					<button
						type="submit"
						class="auth-submit-button"
					>
						Account erstellen
					</button>		
				</form>		
		
				<p
					id="auth-message"
					class="auth-message"
					role="status"
					aria-live="polite"
					hidden
				></p>		
			</div>		
		</dialog>

		<!-- Hauptlayout -->
		<div class="page-layout">

			<!-- Spiele-Navigation -->
			<aside class="sidebar">
				<nav aria-label="Spiele">
					<h2>Spiele</h2>

					<ul id="game-navigation">
						<!-- Wird dynamisch geladen -->
					</ul>
				</nav>
			</aside>

			<!-- Dynamischer Seiteninhalt -->
			<main id="main-content">
				<h2>Willkommen</h2>
				<p>Wähle links ein Spiel aus.</p>
			</main>
		</div>
		
		<footer>
			<p>&copy; 2026 Personal Game Tracker</p>
		</footer>

		<!-- Supabase -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8"></script>
		<!-- Eigener Supabase Client -->
		<script src="./assets/js/supabaseClient.js"></script>
		<!-- Temporärer Verbindungstest -->
		<!-- script src="./assets/js/supabaseTest.js"></script-->
		
		<script type="module" src="assets/js/main.js"></script>
	</body>

</html>
