<main>
	<section class="game-page">
	
		<!-- Spielkopf -->
		<header class="game-header">
			<h2 class="game-title">
				The Division 2
			</h2>
		</header>
	
	
		<!-- Kategorien -->
		<div class="category-grid">
	
			<button
				type="button"
				class="category-card"
				data-category="collectibles"
			>
				<h3>Collectibles</h3>
	
				<p>
					ECHOs, Comms, Found Footage und weitere Sammelobjekte
				</p>
	
				<span class="category-progress">
					124 / 180
				</span>
			</button>
	
	
			<button
				type="button"
				class="category-card"
				data-category="achievements"
			>
				<h3>Achievements</h3>
	
				<p>
					Erfolge und besondere Herausforderungen
				</p>
	
				<span class="category-progress">
					31 / 42
				</span>
			</button>
	
	
			<button
				type="button"
				class="category-card"
				data-category="exotics"
			>
				<h3>Exotics</h3>
	
				<p>
					Exotische Waffen und Ausrüstung
				</p>
	
				<span class="category-progress">
					27 / 35
				</span>
			</button>
	
	
			<button
				type="button"
				class="category-card"
				data-category="blueprints"
			>
				<h3>Blaupausen</h3>
	
				<p>
					Freigeschaltete und noch fehlende Blaupausen
				</p>
	
				<span class="category-progress">
					68 / 95
				</span>
			</button>
	
		</div>
	
	
		<!-- Gesamtfortschritt -->
		<footer class="game-progress">
	
			<div class="game-progress-header">
				<span>Gesamtfortschritt</span>
	
				<strong>
					250 / 352
				</strong>
			</div>
	
			<div
				class="progress-bar"
				role="progressbar"
				aria-label="Gesamtfortschritt"
				aria-valuemin="0"
				aria-valuemax="352"
				aria-valuenow="250"
			>
				<div
					class="progress-bar-fill"
					style="width: 71%;"
				></div>
			</div>
	
			<span class="game-progress-percent">
				71 %
			</span>
	
		</footer>
	
	</section>
</main>
