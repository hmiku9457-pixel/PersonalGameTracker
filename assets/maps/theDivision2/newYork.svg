<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NEW YORK – Kartenplatzhalter</title>
  <desc id="desc">Neutraler Platzhalter. Durch eine vollständige Gebietskarte ersetzen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#7c8ba1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g fill="none" stroke="#30435e" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <path d="M120 190 C330 70 520 280 740 170 S1160 80 1480 230"/>
    <path d="M80 690 C320 560 510 820 770 680 S1190 520 1510 720"/>
    <path d="M300 80 C220 310 400 450 310 900"/>
    <path d="M820 70 C740 330 910 480 850 930"/>
    <path d="M1260 90 C1160 310 1320 500 1220 910"/>
  </g>
  <g fill="#1f3047" stroke="#49617e" stroke-width="5" opacity="0.95">
    <rect x="170" y="280" width="250" height="150" rx="18"/>
    <rect x="500" y="250" width="300" height="210" rx="18"/>
    <rect x="920" y="260" width="260" height="170" rx="18"/>
    <rect x="1180" y="520" width="250" height="180" rx="18"/>
    <rect x="670" y="560" width="300" height="220" rx="18"/>
    <rect x="230" y="570" width="280" height="190" rx="18"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="800" cy="500" r="18" fill="#ff8a00"/>
    <circle cx="800" cy="500" r="42" fill="none" stroke="#ff8a00" stroke-opacity="0.45" stroke-width="5"/>
  </g>
  <text x="800" y="875" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="8">NEW YORK</text>
  <text x="800" y="930" text-anchor="middle" fill="#ff9f2e" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">MAP PLACEHOLDER</text>
</svg>